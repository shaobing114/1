    var CACHE_MS = 10 * 60 * 1000;     // 缓存 10 分钟，省着用 GitHub 接口的额度

    var grid = document.querySelector(".news-grid");
    var hintEl = document.getElementById("newsHint");
    var gamesRow = document.getElementById("gamesRow");

    /* ---------------- 地址工具 ---------------- */
    function encodePath(p) {
      return p.split("/").map(encodeURIComponent).join("/");
    }

    /* 取仓库里某个文件的地址。
       顺序很讲究：
         1. 同源相对路径 —— 页面本身就在 GitHub Pages 上，仓库文件跟 壁纸.png 一样直接取，
            最快，而且不受 raw.githubusercontent / jsDelivr 在国内被墙的影响。★主力
         2. raw.githubusercontent —— 只在页面被搬到别处托管时才用得上
         3. jsDelivr —— 最后的兜底（这个域名在国内时好时坏） */
    var SOURCES = [
      function (p) { return "./" + encodePath(p); },
      function (p) { return "https://raw.githubusercontent.com/" + NEWS_REPO + "/" + NEWS_BRANCH + "/" + encodePath(p); },
      function (p) { return "https://cdn.jsdelivr.net/gh/" + NEWS_REPO + "@" + NEWS_BRANCH + "/" + encodePath(p); }
    ];
    function allUrls(p) { return SOURCES.map(function (f) { return f(p); }); }

    // "看原图"用的地址：优先用真正加载成功过的那个
    function imgUrl(im) {
      if (im.url) return im.url;                 // 页面里手写的兜底卡片，地址已给好
      return im.loaded || SOURCES[0](im.path);
    }

    // 依次尝试三个源；全失败（文件不存在 / 格式浏览器不支持）就留灰底占位
    function loadImg(img, im) {
      if (im.url) { img.src = im.url; return; }

      var urls = im.loaded ? [im.loaded] : allUrls(im.path);
      var i = 0;

      img.onload = function () { im.loaded = img.currentSrc || img.src; };
      img.onerror = function () {
        i++;
        if (i < urls.length) { img.src = urls[i]; return; }
        img.onerror = null;
        img.removeAttribute("src");
        img.classList.add("is-broken");
        console.warn("[news] 配图加载失败：", im.path);
      };
      img.src = urls[0];
    }

    // 二进制（docx 用）：同样依次尝试
    async function fetchBuffer(path) {
      var urls = allUrls(path);
      for (var i = 0; i < urls.length; i++) {
        try {
          // 同源的加 no-cache，保证刚改过的正文立刻生效；
          // 跨源的用普通请求——cache 选项会加自定义头，触发 CORS 预检，
          // 有些 CDN 对预检不友好，反而会失败
          var r = await fetch(urls[i], i === 0 ? { cache: "no-cache" } : undefined);
          if (!r.ok) continue;
          return await r.arrayBuffer();
        } catch (e) { /* 换下一个源 */ }
      }
      return null;
    }

    // 文本：顺便兼容 Windows 记事本存成 GBK 的情况
    async function fetchText(path) {
      var buf = await fetchBuffer(path);
      if (!buf) return "";
      var txt = new TextDecoder("utf-8").decode(buf);
      if (txt.indexOf("\uFFFD") >= 0) {
        try { txt = new TextDecoder("gbk").decode(buf); } catch (e) {}
      }
      return txt.replace(/\r\n/g, "\n").trim();
    }

    /* ---------------- docx 正文：docx 就是个 zip，浏览器原生解压 ---------------- */
    var IMG_MIME = {
      png: "image/png", jpg: "image/jpeg", jpeg: "image/jpeg", gif: "image/gif",
      webp: "image/webp", bmp: "image/bmp", svg: "image/svg+xml"
    };

    function unzip(buf) {
      var view = new DataView(buf), u8 = new Uint8Array(buf);
      var eocd = -1, min = Math.max(0, u8.length - 22 - 65535);
      for (var i = u8.length - 22; i >= min; i--) {
        if (view.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
      }
      if (eocd < 0) throw new Error("不是有效的 docx（找不到 zip 结尾）");

      var count = view.getUint16(eocd + 10, true);
      var off = view.getUint32(eocd + 16, true);
      var files = {}, p = off;

      for (var n = 0; n < count && view.getUint32(p, true) === 0x02014b50; n++) {
        var nameLen = view.getUint16(p + 28, true);
        var extraLen = view.getUint16(p + 30, true);
        var cmtLen = view.getUint16(p + 32, true);
        var name = new TextDecoder("utf-8").decode(u8.subarray(p + 46, p + 46 + nameLen));
        files[name] = {
          method: view.getUint16(p + 10, true),
          size: view.getUint32(p + 20, true),
          local: view.getUint32(p + 42, true)
        };
        p += 46 + nameLen + extraLen + cmtLen;
      }
      return { view: view, u8: u8, files: files };
    }

    async function unzipRead(zip, name) {
      var e = zip.files[name];
      if (!e) return null;
      var nl = zip.view.getUint16(e.local + 26, true);
      var xl = zip.view.getUint16(e.local + 28, true);
      var start = e.local + 30 + nl + xl;
      var data = zip.u8.subarray(start, start + e.size);
      if (e.method === 0) return data;                       // 没压缩
      if (e.method !== 8) throw new Error("docx 用了不支持的压缩方式");
      if (typeof DecompressionStream === "undefined") {
        throw new Error("这个浏览器太旧，读不了 docx。换新版 Chrome / Edge，或改用 正文.txt");
      }
      var stream = new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
      return new Uint8Array(await new Response(stream).arrayBuffer());
    }

    // 返回 [{t:"p",text}, {t:"img",url}]，图文按 docx 里的原始顺序
    async function parseDocx(buf) {
      var zip = unzip(buf);
      var dec = new TextDecoder("utf-8");

      var docBytes = await unzipRead(zip, "word/document.xml");
      if (!docBytes) throw new Error("docx 里读不到 word/document.xml");

      // rId → word/ 下的相对路径
      var rels = {};
      var relBytes = await unzipRead(zip, "word/_rels/document.xml.rels");
      if (relBytes) {
        var rd = new DOMParser().parseFromString(dec.decode(relBytes), "application/xml");
        Array.prototype.forEach.call(rd.getElementsByTagName("Relationship"), function (r) {
          var t = (r.getAttribute("Target") || "").replace(/^\//, "").replace(/^word\//, "");
          rels[r.getAttribute("Id")] = t;
        });
      }

      // word/media/* 全部转成 blob URL（emf/wmf 浏览器显示不了，跳过）
      var urls = {};
      var mediaNames = Object.keys(zip.files).filter(function (n) {
        return n.indexOf("word/media/") === 0;
      });
      for (var i = 0; i < mediaNames.length; i++) {
        var n = mediaNames[i];
        var ext = (n.split(".").pop() || "").toLowerCase();
        if (!IMG_MIME[ext]) continue;
        var bytes = await unzipRead(zip, n);
        if (bytes) {
          urls[n.replace(/^word\//, "")] =
            URL.createObjectURL(new Blob([bytes], { type: IMG_MIME[ext] }));
        }
      }

      // 逐段落抽文字和插图
      var R_NS = "http://schemas.openxmlformats.org/officeDocument/2006/relationships";
      var doc = new DOMParser().parseFromString(dec.decode(docBytes), "application/xml");
      var blocks = [];

      Array.prototype.forEach.call(doc.getElementsByTagName("w:p"), function (p) {
        var text = "", imgs = [];

        (function walk(node) {
          var kids = node.childNodes;
          for (var k = 0; k < kids.length; k++) {
            var c = kids[k];
            if (c.nodeType !== 1) continue;
            var tag = c.nodeName;
            if (tag === "w:t") { text += c.textContent; continue; }
            if (tag === "w:br" || tag === "w:cr") { text += "\n"; continue; }
            if (tag === "w:tab") { text += "\t"; continue; }
            if (tag === "a:blip" || tag === "v:imagedata") {
              var rid = c.getAttributeNS(R_NS, "embed") || c.getAttribute("r:embed") ||
                        c.getAttributeNS(R_NS, "id") || c.getAttribute("r:id");
              if (rid && rels[rid] && urls[rels[rid]]) imgs.push(urls[rels[rid]]);
              continue;
            }
            if (c.childNodes.length) walk(c);
          }
        })(p);

        if (text.trim()) blocks.push({ t: "p", text: text.replace(/\s+$/, "") });
        imgs.forEach(function (u) { blocks.push({ t: "img", url: u }); });
      });

      return blocks;
    }

    /* ---------------- 从文件树拼出新闻列表 ---------------- */
    // "20261005没东西写了喵" → 日期 2026年10月5日 + 标题 没东西写了喵
    function parseFolder(name) {
      var m = /^(\d{4})(\d{2})(\d{2})[\s\-_.、]*([\s\S]*)$/.exec(name);
      if (!m) return { date: "", dateText: "", title: name };
      return {
        date: m[1] + "-" + m[2] + "-" + m[3],
        dateText: m[1] + "年" + parseInt(m[2], 10) + "月" + parseInt(m[3], 10) + "日",
        title: (m[4] || "").trim() || name
      };
    }

    function buildItems(tree) {
      var map = {};

      tree.forEach(function (node) {
        if (!node || node.type !== "blob") return;
        var p = node.path || "";
        if (p.indexOf(NEWS_DIR + "/") !== 0) return;

        var rest = p.slice(NEWS_DIR.length + 1);
        var cut = rest.indexOf("/");
        if (cut < 0) return;                    // 直接丢在 news/ 下的散文件，忽略
        var folder = rest.slice(0, cut);
        var file = rest.slice(cut + 1);
        if (file.indexOf("/") >= 0) return;     // 更深的子目录先不管

        var it = map[folder] || (map[folder] = { key: folder, images: [], textPath: "", textScore: -1 });

        var isImage = /\.(jpe?g|jfif|png|webp|gif|avif|bmp)$/i.test(file);
        var isDocx = /\.docx$/i.test(file);
        var isText = /\.(txt|text|md)$/i.test(file);

        if (isImage) {
          // 排序只看文件名里的数字，跟后缀没关系，所以 jpg/png/webp 混着放也能排对
          var n = /(\d+)/.exec(file);
          it.images.push({ path: p, name: file, num: n ? parseInt(n[1], 10) : 9999 });
        } else if (isDocx || isText) {
          // 多个正文按优先级挑：正文.docx(4) > 任意.docx(3) > 正文.txt(2) > 任意.txt(1) > .md(0)
          var score = isDocx
            ? (/正文/.test(file) ? 4 : 3)
            : (/正文/.test(file) ? 2 : (/\.txt$/i.test(file) ? 1 : 0));
          if (score > it.textScore) { it.textScore = score; it.textPath = p; }
        } else if (file.charAt(0) !== "." && file !== "Thumbs.db") {
          // 认不出来的文件提示一下，免得"我明明放进去了却没显示"
          console.warn("[news] " + p + " 不是支持的格式，已忽略。\n" +
            "配图支持：jpg / jpeg / jfif / png / webp / gif / avif / bmp\n" +
            "正文支持：正文.docx（里面可以插图）/ 正文.txt\n" +
            "HEIC（iPhone 默认格式）、TIFF、RAW 需要先转成 jpg 或 png。");
        }
      });

      var items = Object.keys(map).map(function (k) {
        var it = map[k];
        var meta = parseFolder(k);
        it.title = meta.title;
        it.date = meta.date;
        it.dateText = meta.dateText;
        it.images.sort(function (a, b) { return a.num - b.num || a.name.localeCompare(b.name); });
        return it;
      });

      // 有日期的按日期倒序排前面，没日期的排后面
      items.sort(function (a, b) {
        if (a.date && b.date) return a.date < b.date ? 1 : (a.date > b.date ? -1 : 0);
        if (a.date) return -1;
        if (b.date) return 1;
        return a.key.localeCompare(b.key);
      });
      return items;
    }

    /* ---------------- 拉文件树（带缓存） ---------------- */
    function readCache() {
      try {
        var raw = localStorage.getItem(CACHE_KEY);
        if (!raw) return null;
        var obj = JSON.parse(raw);
        return obj && obj.tree ? obj : null;
      } catch (e) { return null; }
    }
    function writeCache(tree) {
      try { localStorage.setItem(CACHE_KEY, JSON.stringify({ t: Date.now(), tree: tree })); } catch (e) {}
    }

    // 一次请求拿到整个仓库的文件树，新闻和游戏共用同一份
    async function loadTree() {
      // 加了新内容想马上看到：访问「页面地址?refresh=1」就会跳过缓存
      var bypass = /[?&]refresh/.test(location.search) || location.hash === "#refresh";
      var cached = bypass ? null : readCache();
      if (cached && Date.now() - cached.t < CACHE_MS) return cached.tree;

      try {
        var url = "https://api.github.com/repos/" + NEWS_REPO + "/git/trees/" + NEWS_BRANCH + "?recursive=1";
        var r = await fetch(url, { headers: { Accept: "application/vnd.github+json" } });
        if (!r.ok) throw new Error("HTTP " + r.status);
        var data = await r.json();
        var tree = data.tree || [];
        writeCache(tree);
        return tree;
      } catch (e) {
        console.warn("[加载] 拉仓库文件树失败：", e);
        return cached ? cached.tree : null;    // 有旧缓存就先用旧的
      }
    }

    /* ---------------- 游戏：同样从文件树里读 ---------------- */
    // "1战争雷霆" → 排序 1，标题 战争雷霆
    function parseGameFolder(name) {
      var m = /^(\d+)[\s\-_.、]*([\s\S]*)$/.exec(name);
      if (m) return { order: parseInt(m[1], 10), title: (m[2] || "").trim() || name };
      return { order: 9999, title: name };
    }

    // 链接.txt 一行一个：
    //   端游 https://warthunder.com/zh
    //   手游 https://wtmobile.com/zh/
    //   联系我                     ← 不带网址 = 灰色不可点的按钮
    //   # 井号开头  = 注释，会被忽略
    function parseLinks(txt) {
      return txt.split(/\r?\n/).map(function (line) {
        line = line.trim();
        if (!line || line.charAt(0) === "#") return null;
        var i = line.search(/https?:\/\//);
        if (i > 0) return { label: line.slice(0, i).trim(), href: line.slice(i).trim() };
        if (i === 0) return { label: "官网", href: line };
        return { label: line, href: "" };
      }).filter(Boolean);
    }

    function buildGames(tree) {
      var map = {};

      tree.forEach(function (node) {
        if (!node || node.type !== "blob") return;
        var p = node.path || "";
        if (p.indexOf(GAMES_DIR + "/") !== 0) return;

        var rest = p.slice(GAMES_DIR.length + 1);
        var cut = rest.indexOf("/");
        if (cut < 0) return;                    // 直接丢在 games/ 下的散文件，忽略
        var folder = rest.slice(0, cut);
        var file = rest.slice(cut + 1);
        if (file.indexOf("/") >= 0) return;

        var g = map[folder] || (map[folder] = { key: folder, images: [], links: [], linkScore: -1 });
        if (/\.(jpe?g|jfif|png|webp|gif|avif|bmp)$/i.test(file)) {
          g.images.push({ path: p, name: file, cover: /^封面/.test(file) });
        } else if (/\.(txt|text)$/i.test(file)) {
          var score = /链接/.test(file) ? 2 : 1;
          if (score > g.linkScore) { g.linkScore = score; g.txtPath = p; }
        }
      });

      return Object.keys(map).map(function (k) {
        var g = map[k];
        var meta = parseGameFolder(k);
        g.title = meta.title;
        g.order = meta.order;
        // 图标：优先「封面」开头的，否则取文件名最靠前的那张
        g.icon = g.images.filter(function (im) { return im.cover; })[0] ||
                 g.images.slice().sort(function (a, b) { return a.name.localeCompare(b.name); })[0] ||
                 null;
        return g;
      }).sort(function (a, b) {
        return a.order - b.order || a.title.localeCompare(b.title);
      });
    }

    function linksBox(g) {
      var box = document.createElement("div");
      box.className = "game-links";

      if (!g.links || !g.links.length) {
        var none = document.createElement("span");
        none.className = "game-link game-link--muted";
        none.textContent = "敬请期待";
        box.appendChild(none);
        return box;
      }

      g.links.forEach(function (lk, i) {
        var node;
        if (lk.href) {
          node = document.createElement("a");
          node.className = "game-link" + (i > 0 ? " game-link--ghost" : "");
          node.href = lk.href;
          node.target = "_blank";
          node.rel = "noopener noreferrer";
        } else {
          node = document.createElement("span");
          node.className = "game-link game-link--muted";
        }
        node.textContent = lk.label + " →";
        box.appendChild(node);
      });
      return box;
    }

    function makeGameCard(g) {
      var card = document.createElement("article");
      card.className = "game-card";

      var icon = document.createElement("div");
      icon.className = "game-icon" + (g.icon && g.icon.cover ? " game-icon--cover" : "");
      var fb = document.createElement("span");
      fb.className = "game-icon-fallback";
      fb.textContent = g.title.charAt(0) || "游";
      icon.appendChild(fb);
      if (g.icon) {
        var img = document.createElement("img");
        img.alt = g.title;
        img.loading = "lazy";
        img.addEventListener("error", function () { img.hidden = true; fb.hidden = false; });
        img.addEventListener("load", function () {
          fb.hidden = true;                                   // 图出来了就藏掉字母
          // 竖长条 / 横长条的图标，把格子也拉长
          var r = img.naturalHeight / img.naturalWidth;
          if (r > 1.35) icon.classList.add("game-icon--tall");
          else if (r < 0.7) icon.classList.add("game-icon--wide");
        });
        img.src = "./" + encodePath(g.icon.path);
        icon.appendChild(img);
      }

      var h3 = document.createElement("h3");
      h3.className = "game-title";
      h3.textContent = g.title;

      card.appendChild(icon);
      card.appendChild(h3);
      card.appendChild(linksBox(g));
      return card;
    }

    async function renderGames(games) {
      if (!gamesRow || !games.length) return;   // 没建 games/ 就保留页面上手写的那几张

      // 先把所有 链接.txt 并行拉下来，再一次性渲染
      await Promise.all(games.map(async function (g) {
        if (!g.txtPath) return;
        g.links = parseLinks(await fetchText(g.txtPath));
      }));

      gamesRow.innerHTML = "";
      games.forEach(function (g) { gamesRow.appendChild(makeGameCard(g)); });

      console.log("[游戏] 读到 " + games.length + " 个：" +
        games.map(function (g) { return g.title; }).join("、"));
    }

    function showHint(text) {
      if (!hintEl) return;
      hintEl.textContent = text || "";
      hintEl.hidden = !text;
    }

    /* ================= 详情弹层 ================= */
    var modal = document.getElementById("newsModal");
    if (!modal || !grid) return;

    var backdrop = document.getElementById("newsBackdrop");
    var closeBtn = document.getElementById("newsClose");
    var imgSlot = document.getElementById("newsModalImg");
    var titleSlot = document.getElementById("newsModalTitle");
    var dateSlot = document.getElementById("newsModalDate");
    var textSlot = document.getElementById("newsModalText");
    var thumbsEl = document.getElementById("newsModalThumbs");
    var prevBtn = document.getElementById("newsPrev");
    var nextBtn = document.getElementById("newsNext");
    var counterEl = document.getElementById("newsCounter");

    var current = null;
    var lastCard = null;
    var lockedY = 0;
    var token = 0;

    /* ---------------- 点图看原图 ---------------- */
    var lb = document.getElementById("lightbox");
    var lbImg = document.getElementById("lightboxImg");
    var lbPrev = document.getElementById("lightboxPrev");
    var lbNext = document.getElementById("lightboxNext");
    var lbCounter = document.getElementById("lightboxCounter");
    var lbList = [], lbIdx = 0;

    function paintLightbox() {
      var it = lbList[lbIdx];
      if (!it) return;
      lbImg.src = it.src;
      lbImg.alt = it.alt || "";
      var multi = lbList.length > 1;
      if (lbPrev) lbPrev.hidden = !multi;
      if (lbNext) lbNext.hidden = !multi;
      if (lbCounter) {
        lbCounter.hidden = !multi;
        lbCounter.textContent = (lbIdx + 1) + " / " + lbList.length;
      }
    }

    function openLightbox(list, idx) {
      if (!lb || !list || !list.length) return;
      lbList = list;
      lbIdx = idx >= 0 && idx < list.length ? idx : 0;
      paintLightbox();
      lb.classList.add("open");
      lb.setAttribute("aria-hidden", "false");
    }

    function closeLightbox() {
      if (!lb || !lb.classList.contains("open")) return;
      lb.classList.remove("open");
      lb.setAttribute("aria-hidden", "true");
      lbImg.removeAttribute("src");
    }

    function stepLightbox(d) {
      if (lbList.length < 2) return;
      lbIdx = ((lbIdx + d) % lbList.length + lbList.length) % lbList.length;
      paintLightbox();
    }

    /* ---------------- 滚动锁 ---------------- */
    function lockScroll() {
      lockedY = window.pageYOffset || 0;
      document.documentElement.style.overflow = "hidden";
      document.body.style.overflow = "hidden";
    }
    function unlockScroll() {
      document.documentElement.style.overflow = "";
      document.body.style.overflow = "";
      window.scrollTo(0, lockedY);   // 有的浏览器会跳回顶部，这里补回来
    }

    function escapeHtml(s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // 正文：空行分段，段内单换行变成 <br>
    function textToHtml(txt) {
      if (!txt) {
        return '<p class="news-loading">这篇还没有正文——在文件夹里放一个「正文.txt」或「正文.docx」就会出现。</p>';
      }
      return txt.split(/\n{2,}/).map(function (block) {
        return "<p>" + escapeHtml(block).replace(/\n/g, "<br>") + "</p>";
      }).join("");
    }

    // docx 解析出来的块 → HTML（图文保持原顺序）
    function blocksToHtml(blocks) {
      if (!blocks.length) return '<p class="news-loading">这个 docx 里没读到内容。</p>';
      return blocks.map(function (b) {
        if (b.t === "img") {
          return '<img src="' + b.url + '" alt="" loading="lazy">';
        }
        return "<p>" + escapeHtml(b.text).replace(/\n/g, "<br>") + "</p>";
      }).join("");
    }

    // 页面里手写的那张卡片没有 __news，就从 DOM 读
    function itemFromCard(card) {
      var img = card.querySelector(".news-thumb img");
      var title = card.querySelector(".news-card-title");
      var tpl = card.querySelector("template.news-detail");
      var src = img ? (img.getAttribute("src") || "") : "";
      return {
        title: title ? title.textContent : "",
        dateText: "",
        images: src ? [{ url: src }] : [],
        html: tpl ? tpl.innerHTML : "",
        textPath: ""
      };
    }

    function showImage(i) {
      if (!current || !current.images.length) {
        imgSlot.removeAttribute("src");
        return;
      }
      var n = current.images.length;
      current.idx = ((i % n) + n) % n;
      loadImg(imgSlot, current.images[current.idx]);
      imgSlot.alt = current.title;

      var multi = n > 1;
      if (prevBtn) prevBtn.hidden = !multi;
      if (nextBtn) nextBtn.hidden = !multi;
      if (counterEl) {
        counterEl.hidden = !multi;
        counterEl.textContent = (current.idx + 1) + " / " + n;
      }
      if (thumbsEl) {
        Array.prototype.forEach.call(thumbsEl.querySelectorAll("button"), function (b, bi) {
          b.classList.toggle("is-active", bi === current.idx);
        });
      }
    }

    function buildThumbs() {
      if (!thumbsEl) return;
      thumbsEl.innerHTML = "";
      var multi = current && current.images.length > 1;
      thumbsEl.hidden = !multi;
      if (!multi) return;

      current.images.forEach(function (im, i) {
        var b = document.createElement("button");
        b.type = "button";
        b.className = "thumb" + (i === current.idx ? " is-active" : "");
        b.setAttribute("aria-label", "第 " + (i + 1) + " 张配图");
        var t = document.createElement("img");
        t.alt = "";
        t.loading = "lazy";
        loadImg(t, im);
        b.appendChild(t);
        b.addEventListener("click", function () { showImage(i); });
        thumbsEl.appendChild(b);
      });
    }

    async function openNews(card) {
      var item = card.__news || itemFromCard(card);
      var my = ++token;                      // 这一轮的编号

      current = {
        title: item.title,
        dateText: item.dateText || "",
        images: item.images || [],
        idx: 0,
        textPath: item.textPath || "",
        html: item.html || ""
      };

      titleSlot.textContent = current.title;
      if (dateSlot) {
        dateSlot.textContent = current.dateText;
        dateSlot.hidden = !current.dateText;
      }
      buildThumbs();
      showImage(0);
      textSlot.innerHTML = current.textPath
        ? '<p class="news-loading">正在读取正文…</p>'
        : current.html;

      lastCard = card;
      modal.classList.add("open");
      modal.setAttribute("aria-hidden", "false");
      lockScroll();
      closeBtn.focus();

      if (!current.textPath) return;

      // 有正文文件：docx 要解压解析，txt 直接读
      var path = current.textPath;
      var isDocx = /\.docx$/i.test(path);

      if (!isDocx) {
        var txt = await fetchText(path);
        if (my !== token) return;            // 期间关了或换了别的新闻，就别往页面上写了
        textSlot.innerHTML = textToHtml(txt);
        return;
      }

      try {
        var buf = await fetchBuffer(path);
        if (my !== token) return;
        if (!buf) throw new Error("docx 下载失败，检查文件名和网络");
        var blocks = await parseDocx(buf);
        if (my !== token) return;
        textSlot.innerHTML = blocksToHtml(blocks);
      } catch (err) {
        if (my !== token) return;
        textSlot.innerHTML = '<p class="news-loading">docx 读不出来：' +
          escapeHtml(err.message || String(err)) + '</p>';
        console.warn("[news] docx 解析失败：", err);
      }
    }

    function closeNews() {
      if (!modal.classList.contains("open")) return;
      token++;                               // 作废还在路上的正文请求
      closeLightbox();
      modal.classList.remove("open");
      modal.setAttribute("aria-hidden", "true");
      unlockScroll();
      if (lastCard) lastCard.focus();        // 焦点还回卡片，键盘用户不迷路
    }

    /* ---------------- 卡片 ---------------- */
    function bindCards() {
      Array.prototype.forEach.call(document.querySelectorAll(".news-card"), function (card) {
        if (card.__bound) return;
        card.__bound = true;
        card.addEventListener("click", function () { openNews(card); });
        card.addEventListener("keydown", function (e) {
          if (e.key === "Enter" || e.key === " " || e.key === "Spacebar") {
            e.preventDefault();
            openNews(card);
          }
        });
      });
    }

    function makeCard(item) {
      var card = document.createElement("article");
      card.className = "news-card";
      card.setAttribute("role", "button");
      card.setAttribute("tabindex", "0");
      card.setAttribute("aria-label", "打开新闻：" + item.title);

      var thumb = document.createElement("div");
      thumb.className = "news-thumb";
      var img = document.createElement("img");
      img.alt = item.title;
      img.loading = "lazy";
      if (item.images.length) loadImg(img, item.images[0]);
      thumb.appendChild(img);

      var body = document.createElement("div");
      body.className = "news-body";
      var h3 = document.createElement("h3");
      h3.className = "news-card-title";
      h3.textContent = item.title;
      body.appendChild(h3);
      if (item.dateText) {
        var d = document.createElement("div");
        d.className = "news-card-date";
        d.textContent = item.dateText;
        body.appendChild(d);
      }

      card.appendChild(thumb);
      card.appendChild(body);
      card.__news = item;      // 弹层直接从这里取数据
      return card;
    }

    /* ---------------- 事件 ---------------- */
    if (backdrop) backdrop.addEventListener("click", closeNews);
    if (closeBtn) closeBtn.addEventListener("click", closeNews);
    if (prevBtn) prevBtn.addEventListener("click", function () { showImage(current.idx - 1); });
    if (nextBtn) nextBtn.addEventListener("click", function () { showImage(current.idx + 1); });

    // 点主图 → 看原图（不裁切的大图）
    imgSlot.addEventListener("click", function () {
      if (!current || !current.images.length) return;
      openLightbox(current.images.map(function (im) {
        return { src: imgUrl(im), alt: current.title };
      }), current.idx);
    });

    // 点正文里 docx 插的图 → 也能看原图，并且能在同一篇的图之间翻
    textSlot.addEventListener("click", function (e) {
      var t = e.target;
      if (!t || t.tagName !== "IMG") return;
      var imgs = Array.prototype.slice.call(textSlot.querySelectorAll("img"));
      openLightbox(imgs.map(function (m) { return { src: m.src, alt: "" }; }), imgs.indexOf(t));
    });

    if (lb) {
      var lbBackdrop = document.getElementById("lightboxBackdrop");
      var lbClose = document.getElementById("lightboxClose");
      if (lbBackdrop) lbBackdrop.addEventListener("click", closeLightbox);
      if (lbClose) lbClose.addEventListener("click", closeLightbox);
      lbImg.addEventListener("click", closeLightbox);      // 点图本身也关掉
      if (lbPrev) lbPrev.addEventListener("click", function () { stepLightbox(-1); });
      if (lbNext) lbNext.addEventListener("click", function () { stepLightbox(1); });
    }

    document.addEventListener("keydown", function (e) {
      // 灯箱开着时，按键优先给灯箱
      if (lb && lb.classList.contains("open")) {
        if (e.key === "Escape") { closeLightbox(); return; }
        if (e.key === "ArrowLeft") { stepLightbox(-1); return; }
        if (e.key === "ArrowRight") { stepLightbox(1); return; }
        return;
      }

      if (!modal.classList.contains("open")) return;
      if (e.key === "Escape") { closeNews(); return; }
      if (!current) return;
      if (e.key === "ArrowLeft") showImage(current.idx - 1);
      if (e.key === "ArrowRight") showImage(current.idx + 1);
    });

    /* ---------------- 启动 ---------------- */
    bindCards();   // 先让页面里手写的那张卡片可以点

    (async function init() {
      var tree = await loadTree();

      if (tree === null) {
        // 拉不到就保留页面上手写的兜底内容，不算白屏
        showHint("内容暂时拉不到（可能是 GitHub 接口限流或网络不通），刷新一下再看看。");
        return;
      }

      /* ---- 新闻 ---- */
      var items = buildItems(tree);
      if (!items.length) {
        showHint("还没检测到新闻。在仓库里建一个 " + NEWS_DIR + "/日期+标题/ 这样的文件夹，" +
                 "里面放「配图01.jpg」和「正文.txt」或「正文.docx」，这里就会自动出现。");
      } else {
        showHint("");
        grid.innerHTML = "";
        items.forEach(function (it) { grid.appendChild(makeCard(it)); });
        bindCards();
        console.log("[新闻] 读到 " + items.length + " 条：" +
          items.map(function (it) { return it.title; }).join("、"));
      }

      /* ---- 游戏 ---- */
      await renderGames(buildGames(tree));
    })();
  })();
</script>

<script type="module">
  /* ================================================================
     Supabase 登录配置 —— 只需要改这三行
     ================================================================
     这两个值去哪找（Supabase 后台改版过，认准下面两条路）：

       ① 最快：进项目后点顶部的 【Connect】 按钮，
          弹窗里直接给你 Project URL 和 Publishable key，复制即可。

       ② 或者：左侧 Settings（齿轮）→ API Keys
          （注意：新版后台已经没有单独的 Settings → API 页面了）
          - Project URL        → 填到 SUPABASE_URL
          - Publishable key    → 填到 SUPABASE_PUBLISHABLE_KEY
            形如 sb_publishable_xxxxxxxx
            老项目里那串 eyJ 开头的 anon key 也能填，效果一样。

     关于安全：Publishable key（老的 anon key）本来就是给浏览器用的
     公开密钥，放在前端不算泄密，真正的权限由数据库 RLS 策略控制。
     千万千万不能把 Secret key / service_role key 写在这里，那是总钥匙！
     ================================================================ */
  const SUPABASE_URL = "https://zowfbpbwqnikxmcmjwfr.supabase.co";  // 已填好
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_c7PYeDklxVVRtG5W1JUpmQ_7emESIWH";  // 已填好
  const ENABLE_GITHUB_OAUTH = false;     // 想用「GitHub 登录」就改成 true

  /* 【可选·国内网络不稳时的终极解法】
     用浏览器打开 https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm
     → Ctrl+S 另存为 supabase.js，放到本文件旁边 → 把下面这行改成 "supabase.js"
     这样就直接读仓库里的文件，完全不依赖外部 CDN。 */
  const LOCAL_LIB = "";

  /* supabase-js 的加载地址：先试 ESM，全不通再退回官方文档里的 UMD 全局脚本。
     多写几个是防止某个 CDN 被墙 —— 任何一个能通就能用。 */
  const LOAD_TIMEOUT = 6000;   // 单个源最多等 6 秒，超时就换下一个，不会一直卡住
  const ESM_SOURCES = [
    "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm",
    "https://esm.sh/@supabase/supabase-js@2"
  ];
  const UMD_SOURCES = [
    "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2",
    "https://unpkg.com/@supabase/supabase-js@2"
  ];

  const $ = (id) => document.getElementById(id);
  const els = {
    auth: $("auth"), btn: $("authBtn"), label: $("authLabel"), avatar: $("authAvatar"),
    panel: $("authPanel"), close: $("authClose"), tabs: $("authTabs"),
    title: $("authTitle"), sub: $("authSub"), form: $("authForm"),
    email: $("authEmail"), password: $("authPassword"), submit: $("authSubmit"),
    oauth: $("authOauth"), github: $("authGithub"), msg: $("authMsg"),
    user: $("authUser"), userEmail: $("authUserEmail"), signout: $("authSignout"),
    profileAvatar: $("profileAvatar"), profileName: $("profileName"),
    nick: $("nickInput"), saveNick: $("authSaveNick")
  };

  let supabase = null;
  let mode = "signin";      // signin | signup
  let currentUser = null;
  // loading=正在加载库 / ready=可以点了 / failed=加载失败 / unconfigured=没填配置
  let libState = "loading";
  let lastUserId = null;    // 用来区分"换了个人"和"只是改了资料"

  /* ---------------- 面板开合 ---------------- */
  function openPanel(open) {
    els.auth.classList.toggle("open", open);
    els.btn.setAttribute("aria-expanded", open ? "true" : "false");
    if (open && !currentUser && supabase) els.email.focus();
  }

  els.btn.addEventListener("click", function () {
    openPanel(!els.auth.classList.contains("open"));
  });

  els.close.addEventListener("click", function () { openPanel(false); });

  // 点面板外面 / 按 Esc 关闭
  document.addEventListener("click", function (e) {
    if (!els.auth.contains(e.target)) openPanel(false);
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") openPanel(false);
  });

  /* ---------------- 小工具 ---------------- */
  function msg(text, kind) {
    els.msg.textContent = text || "";
    els.msg.className = "auth-msg" + (kind ? " is-" + kind : "");
  }

  /* 提交按钮的状态完全由 libState 决定：
     库没就绪之前一律禁用并写明原因，绝不出现"看着能点、点了没反应"。 */
  function refreshSubmit() {
    if (libState === "ready") {
      els.submit.disabled = false;
      els.submit.textContent = mode === "signin" ? "登录" : "注册";
    } else {
      els.submit.disabled = true;
      els.submit.textContent =
        libState === "failed" ? "加载失败" :
        libState === "unconfigured" ? "未配置" : "加载中…";
    }
  }

  function busy(on) {
    if (libState !== "ready") { refreshSubmit(); return; }
    els.submit.disabled = on;
    els.submit.textContent = on ? "处理中…" : (mode === "signin" ? "登录" : "注册");
  }

  function setMode(next) {
    mode = next;
    Array.prototype.forEach.call(els.tabs.querySelectorAll(".auth-tab"), function (t) {
      t.classList.toggle("is-active", t.dataset.mode === next);
    });
    const signin = next === "signin";
    els.title.textContent = signin ? "登录" : "注册";
    els.sub.textContent = signin ? "用邮箱和密码登录" : "注册后需要去邮箱点确认链接";
    els.password.setAttribute("autocomplete", signin ? "current-password" : "new-password");
    // 加载中 / 出错时的提示不要被清掉
    if (libState === "ready") msg("");
    refreshSubmit();
  }

  els.tabs.addEventListener("click", function (e) {
    const tab = e.target.closest(".auth-tab");
    if (tab) setMode(tab.dataset.mode);
  });

  /* ---------------- 三个按钮：同步就绑好，不等库加载 ----------------
     这样即使 CDN 很慢，点下去也一定有明确反馈，而不是石沉大海。 */
  els.form.addEventListener("submit", async function (e) {
    e.preventDefault();
    if (libState !== "ready" || !supabase) {
      msg(libState === "failed"
        ? "登录服务没加载成功，刷新页面重试"
        : "登录服务还在加载，等几秒再点一次", "warn");
      return;
    }

    const email = els.email.value.trim();
    const password = els.password.value;
    if (!email || !password) { msg("请把邮箱和密码都填上", "error"); return; }
    if (password.length < 6) { msg("密码至少要 6 位", "error"); return; }

    busy(true);
    msg("");
    try {
      if (mode === "signin") {
        const { error } = await supabase.auth.signInWithPassword({ email: email, password: password });
        if (error) throw error;
        msg("登录成功", "ok");
        openPanel(false);
      } else {
        const { data, error } = await supabase.auth.signUp({
          email: email,
          password: password,
          options: { emailRedirectTo: location.href.split("#")[0] }
        });
        if (error) throw error;
        if (data && data.session) {
          msg("注册成功，已自动登录", "ok");
          openPanel(false);
        } else {
          msg("注册成功！请去 " + email + " 的收件箱点确认链接", "ok");
        }
      }
    } catch (err) {
      msg(zh(err), "error");
    } finally {
      busy(false);
    }
  });

  els.github.addEventListener("click", async function () {
    if (libState !== "ready" || !supabase) { msg("登录服务还在加载，稍等一下", "warn"); return; }
    msg("");
    const { error } = await supabase.auth.signInWithOAuth({
      provider: "github",
      options: { redirectTo: location.href.split("#")[0] }
    });
    if (error) msg(zh(error), "error");
  });

  els.signout.addEventListener("click", async function () {
    if (libState !== "ready" || !supabase) { msg("登录服务还在加载，稍等一下", "warn"); return; }
    await supabase.auth.signOut();
    msg("已退出登录", "ok");
    openPanel(false);
  });

  /* 个人中心：保存昵称
     存在账号自带的 user_metadata 里，不用建表、不用配 RLS，改完立刻生效。
     想做成"能被别人看到的公开昵称"，那才需要建 profiles 表 + RLS 策略。 */
  els.saveNick.addEventListener("click", async function () {
    if (libState !== "ready" || !supabase) { msg("登录服务还在加载，稍等一下", "warn"); return; }

    const nick = els.nick.value.trim();
    if (!nick) { msg("昵称不能为空", "error"); return; }
    if (nick.length > 20) { msg("昵称最多 20 个字", "error"); return; }

    els.saveNick.disabled = true;
    els.saveNick.textContent = "保存中…";
    try {
      const { data, error } = await supabase.auth.updateUser({ data: { nickname: nick } });
      if (error) throw error;
      if (data && data.user) renderUser(data.user);
      msg("昵称已保存", "ok");
    } catch (err) {
      msg(zh(err), "error");
    } finally {
      els.saveNick.disabled = false;
      els.saveNick.textContent = "保存昵称";
    }
  });

  /* 把 Supabase 的英文报错翻成人话 */
  const ERROR_MAP = [
    [/invalid login credentials/i,        "邮箱或密码不正确"],
    [/email not confirmed/i,              "邮箱还没确认，先去收件箱点确认链接"],
    [/user already registered/i,          "这个邮箱已经注册过了，直接登录就行"],
    [/password should be at least/i,      "密码至少要 6 位"],
    [/unable to validate email|invalid email/i, "邮箱格式看起来不对"],
    [/rate limit|too many requests/i,     "操作太频繁了，等几分钟再试"],
    [/signups not allowed|signup.*disabled/i, "该站点已关闭注册功能"]
  ];

  function zh(err) {
    const raw = (err && err.message) ? err.message : String(err || "未知错误");
    for (let i = 0; i < ERROR_MAP.length; i++) {
      if (ERROR_MAP[i][0].test(raw)) return ERROR_MAP[i][1];
    }
    return raw;
  }

  /* ---------------- 昵称 ---------------- */
  function nicknameOf(user) {
    if (!user) return "";
    const meta = user.user_metadata || {};
    return String(meta.nickname || meta.full_name || meta.name || "").trim();
  }

  // 有昵称就用昵称，没设过就退回邮箱 @ 前面那段
  function displayName(user) {
    const nick = nicknameOf(user);
    if (nick) return nick;
    const email = (user && user.email) || "";
    return email.indexOf("@") > 0 ? email.split("@")[0] : (email || "已登录");
  }

  /* ---------------- 按登录状态切换界面 ---------------- */
  function renderUser(user) {
    currentUser = user || null;
    const signedIn = !!currentUser;
    const whoChanged = (currentUser ? currentUser.id : null) !== lastUserId;
    lastUserId = currentUser ? currentUser.id : null;

    els.form.hidden = signedIn;
    els.tabs.hidden = signedIn;
    els.oauth.hidden = signedIn || !ENABLE_GITHUB_OAUTH;
    els.user.hidden = !signedIn;
    els.avatar.hidden = !signedIn;

    if (signedIn) {
      const email = currentUser.email || "";
      const name = displayName(currentUser);
      const initial = (name.charAt(0) || "?").toUpperCase();

      els.label.textContent = name;
      els.avatar.textContent = initial;
      els.profileAvatar.textContent = initial;
      els.profileName.textContent = name;
      els.userEmail.textContent = email || "（没有绑定邮箱）";
      els.title.textContent = "个人中心";
      els.sub.textContent = "改昵称 / 看账号";
      // 只在换了人时回填输入框，免得打字打到一半被冲掉
      if (whoChanged) {
        els.nick.value = nicknameOf(currentUser);
        msg("");
      }
    } else {
      els.label.textContent = "登录";
      setMode(mode);
    }
  }

  /* ---------------- 动态加载 supabase-js ---------------- */
  function loadScript(src) {
    return new Promise(function (resolve, reject) {
      const s = document.createElement("script");
      s.src = src;
      s.async = true;
      s.onload = function () { resolve(); };
      s.onerror = function () { reject(new Error("加载失败：" + src)); };
      document.head.appendChild(s);
    });
  }

  // 给每个源加超时，别让一个卡住的请求把整个流程拖死
  function withTimeout(promise, ms, label) {
    return new Promise(function (resolve, reject) {
      const timer = setTimeout(function () { reject(new Error("超时：" + label)); }, ms);
      promise.then(
        function (v) { clearTimeout(timer); resolve(v); },
        function (e) { clearTimeout(timer); reject(e); }
      );
    });
  }

  // ESM 模块 / UMD 全局 的导出形状不太一样，统一取一下 createClient
  function pickCreateClient(mod) {
    if (!mod) return null;
    if (typeof mod.createClient === "function") return mod.createClient;
    if (mod.supabase && typeof mod.supabase.createClient === "function") return mod.supabase.createClient;
    if (mod.default && typeof mod.default.createClient === "function") return mod.default.createClient;
    return null;
  }

  async function loadLibrary() {
    const tries = [];
    if (LOCAL_LIB) tries.push({ type: "esm", src: "./" + LOCAL_LIB });  // 仓库里的本地副本，优先级最高
    ESM_SOURCES.forEach(function (src) { tries.push({ type: "esm", src: src }); });
    UMD_SOURCES.forEach(function (src) { tries.push({ type: "umd", src: src }); });

    for (let i = 0; i < tries.length; i++) {
      const t = tries[i];
      try {
        if (t.type === "esm") {
          const mod = await withTimeout(import(t.src), LOAD_TIMEOUT, t.src);
          // 本地文件可能是 ESM 版也可能是 UMD 版，两种都认一下
          const fn = pickCreateClient(mod) || pickCreateClient(window.supabase);
          if (fn) return fn;
        } else {
          // 模块里的 supabase 变量会遮蔽全局，所以显式写 window.supabase
          await withTimeout(loadScript(t.src), LOAD_TIMEOUT, t.src);
          const fn = pickCreateClient(window.supabase);
          if (fn) return fn;
        }
      } catch (err) {
        /* 这个源不通或超时，试下一个 */
      }
    }
    return null;
  }

  /* ---------------- 启动 ---------------- */
  (async function initAuth() {
    if (!SUPABASE_URL || !SUPABASE_PUBLISHABLE_KEY) {
      libState = "unconfigured";
      renderUser(null);
      els.email.disabled = true;
      els.password.disabled = true;
      msg("还没配置 Supabase：把 SUPABASE_URL 和 SUPABASE_PUBLISHABLE_KEY 填到 index.html 顶部的配置区就能用了。", "warn");
      return;
    }

    // 先把"正在加载"摆出来，别让人对着一个点了没反应的按钮发呆
    refreshSubmit();
    msg("正在加载登录服务，请稍等几秒…", "warn");

    const createClient = await loadLibrary();

    if (!createClient) {
      libState = "failed";
      refreshSubmit();
      msg("登录服务加载失败（CDN 被拦截或网络太慢）。刷新重试；一直不行就把 supabase-js 下到仓库里，再把 LOCAL_LIB 打开。", "error");
      return;
    }

    libState = "ready";
    refreshSubmit();
    msg("");

    supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
      auth: {
        persistSession: true,     // 关掉浏览器再打开还是登录状态
        autoRefreshToken: true,   // 自动续期
        detectSessionInUrl: true  // 处理 OAuth 回跳
      }
    });

    /* 表单提交 / GitHub / 退出登录 三个监听器已经在上面同步绑定好了 */

    /* 读取已有登录状态，并监听后续变化 */
    const { data } = await supabase.auth.getSession();
    renderUser(data && data.session ? data.session.user : null);

    supabase.auth.onAuthStateChange(function (_event, session) {
      renderUser(session ? session.user : null);
    });
  })();
</script>
