<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>你好，我是烧饼114</title>
<style>
  /* ===== 想调整文字位置，只改这两个值即可 =====
     50% / 50% = 正中；想放到左侧空白处试试 34% / 46% */
  :root {
    --text-x: 50%;
    --text-y: 50%;
    --font-cn: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB",
               "Noto Sans SC", system-ui, -apple-system, sans-serif;

    /* 右上角两个药丸按钮的配色：默认（壁纸那种深底上用的）玻璃样式 */
    --pill-bg: rgba(18, 24, 40, 0.42);
    --pill-bg-hover: rgba(30, 40, 66, 0.62);
    --pill-border: rgba(255, 255, 255, 0.22);
    --pill-border-hover: rgba(255, 255, 255, 0.34);
    --pill-fg: #ffffff;
    --pill-shadow: 0 6px 22px rgba(0, 0, 0, 0.35),
                   inset 0 1px 0 rgba(255, 255, 255, 0.18);

    color-scheme: light;   /* 让滚动条、表单控件跟着主题走 */
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  [hidden] { display: none !important; }

  html, body {
    width: 100%;
    background: #0b0b0f; /* 图片加载前的底色，避免白屏闪烁 */
  }

  /* 页面现在要能纵向滚动：第一屏是主页，往下是新闻页 */
  body {
    overflow-x: hidden;
    color: #172033;
  }

  /* ===== 背景图层：打开网页时淡入 ===== */
  .bg {
    position: fixed;
    inset: 0;
    background-image: url("./壁纸.png");
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    opacity: 0;
    transform: scale(1.08);
    animation: bgFadeIn 1.8s cubic-bezier(0.22, 0.61, 0.36, 1) 0.15s forwards;
    will-change: opacity, transform;
  }

  @keyframes bgFadeIn {
    0% {
      opacity: 0;
      transform: scale(1.08);
      filter: blur(6px);
    }
    60% {
      filter: blur(2px);
    }
    100% {
      opacity: 1;
      transform: scale(1);
      filter: blur(0);
    }
  }

  /* 四周压暗，让画面更有氛围、文字更突出 */
  .overlay {
    position: fixed;
    inset: 0;
    background: radial-gradient(
      ellipse at center,
      rgba(0, 0, 0, 0.05) 0%,
      rgba(0, 0, 0, 0.40) 100%
    );
    opacity: 0;
    animation: fadeIn 1.8s ease 0.45s forwards;
    pointer-events: none;
  }

  @keyframes fadeIn {
    to { opacity: 1; }
  }

  /* ===== 文字锚点：由 --text-x / --text-y 决定位置 ===== */
  .anchor {
    position: fixed;
    left: var(--text-x);
    top: var(--text-y);
    transform: translate(-50%, -50%);
    /* 这行别删：fixed 元素的可用宽度 = 视口宽 - left，
       不写 width 的话 left:50% 会把可用宽度挤成一半，标题会莫名换行 */
    width: max-content;
    max-width: 92vw;
    z-index: 2;
  }

  /* ===== 文字本体 ===== */
  .title {
    position: relative;
    font-family: var(--font-cn);
    font-size: clamp(26px, 6.5vw, 76px);
    font-weight: 700;
    letter-spacing: 0.06em;
    line-height: 1.3;
    text-align: center;
    color: #ffffff;
    /* 只有笔画周围压暗，不遮画面本身，白字在任何底色上都清楚 */
    text-shadow:
      0 0 8px rgba(0, 0, 0, 0.70),
      0 3px 14px rgba(0, 0, 0, 0.70),
      0 6px 28px rgba(0, 0, 0, 0.50);
    /* 等背景淡入差不多结束再开始逐字跳出 */
    opacity: 0;
    animation: titleShow 0.01s linear 1.5s forwards;
  }

  @keyframes titleShow {
    to { opacity: 1; }
  }

  #typed { display: inline; }

  /* 每个字：快速上浮 + 放大回弹 + 淡入 */
  .char {
    display: inline-block;
    opacity: 0;
    transform: translateY(0.45em) scale(0.9);
    animation: charPop 0.34s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
  }

  @keyframes charPop {
    to {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  /* 光标 */
  .cursor {
    display: inline-block;
    width: 0.06em;
    height: 1.05em;
    min-width: 3px;
    margin-left: 0.06em;
    vertical-align: -0.14em;
    background: #ffffff;
    box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
    animation: blink 0.72s steps(1) infinite;
  }

  @keyframes blink {
    0%, 49%   { opacity: 1; }
    50%, 100% { opacity: 0; }
  }

  /* 打完字后光标再闪几下就停住 */
  .cursor.done {
    animation: blink 0.72s steps(1) 4;
  }

  /* ================= 右上角：深色模式开关 + 登录入口 ================= */
  .auth {
    position: fixed;
    top: 18px;
    right: 18px;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--font-cn);
    -webkit-tap-highlight-color: transparent;
  }

  /* 深色模式开关：圆形玻璃按钮，太阳/月亮两个图标按主题切换显示 */
  .theme-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    padding: 0;
    cursor: pointer;
    border-radius: 50%;
    backdrop-filter: blur(12px) saturate(140%);
    -webkit-backdrop-filter: blur(12px) saturate(140%);
    transition: background 0.2s ease, border-color 0.2s ease, transform 0.12s ease;
    animation: dropIn 0.6s cubic-bezier(0.22, 0.61, 0.36, 1) 1s both;
  }

  .theme-btn:active { transform: scale(0.94); }

  .theme-btn:focus-visible {
    outline: 2px solid rgba(140, 200, 255, 0.9);
    outline-offset: 2px;
  }

  .theme-btn svg {
    display: block;
    width: 19px;
    height: 19px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.9;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .theme-btn .icon-sun circle { fill: currentColor; stroke: none; }
  .theme-btn .icon-moon path { fill: currentColor; stroke: none; }

  /* 浅色模式显示月亮（点了变深色），深色模式显示太阳 */
  .theme-btn .icon-sun { display: none; }
  html.dark .theme-btn .icon-sun { display: block; }
  html.dark .theme-btn .icon-moon { display: none; }

  /* 毛玻璃胶囊按钮 */
  .auth-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    height: 40px;
    padding: 0 16px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.02em;
    cursor: pointer;
    border-radius: 999px;
    backdrop-filter: blur(12px) saturate(140%);
    -webkit-backdrop-filter: blur(12px) saturate(140%);
    transition: background 0.2s ease, border-color 0.2s ease, transform 0.12s ease;
    animation: dropIn 0.6s cubic-bezier(0.22, 0.61, 0.36, 1) 1.1s both;
  }

  /* 这两个按钮的配色统一走变量，浅色页 / 深色模式各换一套 */
  .auth-btn,
  .theme-btn {
    color: var(--pill-fg);
    border: 1px solid var(--pill-border);
    background: var(--pill-bg);
    box-shadow: var(--pill-shadow);
  }

  .auth-btn:hover,
  .theme-btn:hover {
    background: var(--pill-bg-hover);
    border-color: var(--pill-border-hover);
  }

  .auth-btn:active { transform: scale(0.97); }

  .auth-btn:focus-visible {
    outline: 2px solid rgba(140, 200, 255, 0.9);
    outline-offset: 2px;
  }

  @keyframes dropIn {
    from { opacity: 0; transform: translateY(-10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .auth-avatar {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    font-size: 12px;
    font-weight: 700;
    color: #0b1220;
    background: linear-gradient(140deg, #bfe3ff, #7fc4ff);
  }

  /* 下拉面板 */
  .auth-panel {
    display: none;
    position: absolute;
    top: calc(100% + 10px);
    right: 0;
    width: min(322px, calc(100vw - 36px));
    padding: 18px;
    color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 16px;
    background: rgba(14, 19, 32, 0.66);
    backdrop-filter: blur(18px) saturate(150%);
    -webkit-backdrop-filter: blur(18px) saturate(150%);
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.14);
    transform-origin: top right;
  }

  .auth.open .auth-panel {
    display: block;
    animation: panelIn 0.2s cubic-bezier(0.22, 0.61, 0.36, 1);
  }

  @keyframes panelIn {
    from { opacity: 0; transform: translateY(-8px) scale(0.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .auth-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 14px;
  }

  .auth-title { font-size: 16px; font-weight: 700; }

  .auth-sub {
    margin-top: 3px;
    font-size: 12px;
    color: rgba(255, 255, 255, 0.6);
  }

  .auth-close {
    padding: 4px;
    font-size: 17px;
    line-height: 1;
    color: rgba(255, 255, 255, 0.6);
    cursor: pointer;
    border: 0;
    border-radius: 8px;
    background: transparent;
    transition: 0.18s;
  }

  .auth-close:hover { color: #fff; background: rgba(255, 255, 255, 0.1); }

  /* 登录 / 注册 切换 */
  .auth-tabs {
    display: flex;
    gap: 4px;
    padding: 3px;
    margin-bottom: 14px;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.07);
  }

  .auth-tab {
    flex: 1;
    padding: 7px 0;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.62);
    cursor: pointer;
    border: 0;
    border-radius: 8px;
    background: transparent;
    transition: 0.18s;
  }

  .auth-tab.is-active {
    color: #0b1220;
    background: linear-gradient(140deg, #eaf4ff, #b9dcff);
  }

  .auth-form { display: flex; flex-direction: column; gap: 11px; }

  .auth-field {
    display: flex;
    flex-direction: column;
    gap: 5px;
    font-size: 12px;
    color: rgba(255, 255, 255, 0.66);
  }

  .auth-field input {
    height: 38px;
    padding: 0 11px;
    font-family: inherit;
    font-size: 14px;
    color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.07);
    transition: border-color 0.18s, background 0.18s;
  }

  .auth-field input::placeholder { color: rgba(255, 255, 255, 0.34); }

  .auth-field input:focus {
    outline: none;
    border-color: rgba(140, 200, 255, 0.75);
    background: rgba(255, 255, 255, 0.11);
  }

  .auth-submit {
    height: 40px;
    margin-top: 3px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: #0b1220;
    cursor: pointer;
    border: 0;
    border-radius: 10px;
    background: linear-gradient(140deg, #eaf4ff, #a8d4ff);
    box-shadow: 0 6px 18px rgba(120, 190, 255, 0.28);
    transition: filter 0.18s, transform 0.12s;
  }

  .auth-submit:hover { filter: brightness(1.06); }
  .auth-submit:active { transform: scale(0.985); }
  .auth-submit:disabled { opacity: 0.55; cursor: default; filter: none; transform: none; }

  /* GitHub 登录 */
  .auth-or {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 13px 0 11px;
    font-size: 11px;
    color: rgba(255, 255, 255, 0.42);
  }

  .auth-or::before,
  .auth-or::after {
    content: "";
    flex: 1;
    height: 1px;
    background: rgba(255, 255, 255, 0.14);
  }

  .auth-gh {
    width: 100%;
    height: 38px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    color: #fff;
    cursor: pointer;
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.07);
    transition: 0.18s;
  }

  .auth-gh:hover { background: rgba(255, 255, 255, 0.14); }

  /* 提示信息 */
  .auth-msg {
    margin-top: 11px;
    font-size: 12px;
    line-height: 1.5;
    color: rgba(255, 255, 255, 0.7);
  }

  .auth-msg:empty { display: none; }
  .auth-msg.is-error { color: #ffb4b4; }
  .auth-msg.is-ok    { color: #9ff0c4; }
  .auth-msg.is-warn  { color: #ffd89b; }

  /* 已登录状态 */
  .auth-user { display: flex; flex-direction: column; gap: 11px; }

  .auth-signout {
    height: 38px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    color: #fff;
    cursor: pointer;
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.07);
    transition: 0.18s;
  }

  .auth-signout:hover {
    background: rgba(255, 120, 120, 0.18);
    border-color: rgba(255, 140, 140, 0.42);
  }

  @media (max-width: 480px) {
    .auth { top: 14px; right: 14px; }
    .auth-btn { height: 36px; padding: 0 13px; font-size: 13px; }
  }

  /* ================= 个人中心（登录后显示） ================= */
  .profile {
    display: flex;
    align-items: center;
    gap: 11px;
    padding-bottom: 13px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.12);
  }

  .profile-avatar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    font-size: 18px;
    font-weight: 700;
    color: #0b1220;
    background: linear-gradient(140deg, #bfe3ff, #7fc4ff);
  }

  .profile-info { min-width: 0; }

  .profile-name {
    font-size: 15px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .profile-email {
    margin-top: 2px;
    font-size: 12px;
    color: rgba(255, 255, 255, 0.58);
    word-break: break-all;
  }

  .profile-tip {
    font-size: 11px;
    line-height: 1.5;
    color: rgba(255, 255, 255, 0.45);
  }

  /* ================= 第一屏 + 向下滑动提示 ================= */
  .hero {
    position: relative;
    z-index: 1;
    height: 100vh;
    height: 100svh;   /* 手机上避开地址栏抖动 */
  }

  .scroll-hint {
    position: absolute;
    left: 50%;
    bottom: 26px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 7px;
    font-family: var(--font-cn);
    font-size: 12px;
    letter-spacing: 0.16em;
    color: rgba(255, 255, 255, 0.72);
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
    transform: translateX(-50%);
    animation: hintIn 1s ease 2.6s both;
    pointer-events: none;
  }

  @keyframes hintIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  /* 用边框画一个小箭头，省得引图标 */
  .scroll-hint i {
    width: 9px;
    height: 9px;
    border-right: 2px solid rgba(255, 255, 255, 0.8);
    border-bottom: 2px solid rgba(255, 255, 255, 0.8);
    transform: rotate(45deg);
    animation: hintBob 1.6s ease-in-out infinite;
  }

  @keyframes hintBob {
    0%, 100% { transform: rotate(45deg) translate(0, 0); opacity: 0.55; }
    50%      { transform: rotate(45deg) translate(3px, 3px); opacity: 1; }
  }

  /* ================= 新闻页：随滚动推上来的白底 ================= */
  .news {
    position: relative;
    z-index: 5;                 /* 高于标题(2)，所以滚上来会把主页盖住 */
    min-height: 100vh;
    padding: 0 22px 90px;
    background: #ffffff;
    color: #172033;
    font-family: var(--font-cn);
    /* --reveal 由滚动位置驱动：0 = 还在屏幕下方，1 = 完全铺满 */
    border-radius: calc((1 - var(--reveal, 0)) * 30px)
                   calc((1 - var(--reveal, 0)) * 30px) 0 0;
    box-shadow: 0 calc(var(--reveal, 0) * -6px) 60px rgba(0, 0, 0, 0.45);
  }

  /* 顶部那条小横杠，看着像"抽上来的一张纸" */
  .news-grabber {
    width: 46px;
    height: 5px;
    margin: 0 auto;
    border-radius: 99px;
    background: rgba(23, 32, 51, 0.14);
    transform: translateY(14px);
    opacity: calc(1 - var(--reveal, 0) * 0.7);
  }

  /* 内容默认藏着，等白底铺满再加 .is-ready 才出来 */
  .news-inner {
    max-width: 1100px;
    margin: 0 auto;
    padding-top: 74px;
    opacity: 0;
    transform: translateY(26px);
    transition: opacity 0.55s ease 0.1s, transform 0.55s cubic-bezier(0.22, 0.61, 0.36, 1) 0.1s;
  }

  .news.is-ready .news-inner {
    opacity: 1;
    transform: none;
  }

  .news-heading {
    margin-bottom: 26px;
    font-size: clamp(30px, 5vw, 46px);
    font-weight: 800;
    letter-spacing: 0.04em;
  }

  /* 透明横条只作装饰，给标题一点节奏 */
  .news-heading::after {
    content: "";
    display: block;
    width: 52px;
    height: 4px;
    margin-top: 14px;
    border-radius: 99px;
    background: linear-gradient(90deg, #7fc4ff, #b9dcff);
  }

  /* 上图下文的小方格 */
  .news-grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 22px;
  }

  .news-card {
    width: 320px;
    max-width: 100%;
    overflow: hidden;
    border: 1px solid rgba(23, 32, 51, 0.08);
    border-radius: 20px;
    background: #fff;
    box-shadow: 0 10px 26px rgba(23, 32, 51, 0.08);
    cursor: pointer;
    opacity: 0;
    transform: translateY(18px);
    transition: opacity 0.5s ease 0.18s,
                transform 0.5s cubic-bezier(0.22, 0.61, 0.36, 1) 0.18s,
                box-shadow 0.28s ease;
  }

  .news-card:focus-visible {
    outline: 3px solid rgba(127, 196, 255, 0.9);
    outline-offset: 3px;
  }

  .news.is-ready .news-card {
    opacity: 1;
    transform: none;
  }

  .news.is-ready .news-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 18px 40px rgba(23, 32, 51, 0.14);
  }

  .news-thumb {
    aspect-ratio: 1 / 1;
    overflow: hidden;
    background: #eef2f8;
  }

  .news-thumb img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.5s cubic-bezier(0.22, 0.61, 0.36, 1);
  }

  /* 配图实在加载不出来（格式不支持 / 文件不存在）时的斜纹灰底，比裂图好看 */
  .news-thumb img.is-broken,
  .news-modal-hero img.is-broken,
  .news-modal-thumbs img.is-broken {
    background: repeating-linear-gradient(45deg, #eef2f8 0 12px, #e2e9f3 12px 24px);
  }

  .news.is-ready .news-card:hover .news-thumb img {
    transform: scale(1.045);
  }

  .news-body { padding: 16px 18px 20px; }

  .news-card-title {
    font-size: 17px;
    font-weight: 700;
    line-height: 1.45;
  }

  .news-card-text {
    margin-top: 7px;
    font-size: 13px;
    line-height: 1.7;
    color: #5c6a80;
  }

  .news-card-date {
    margin-top: 6px;
    font-size: 12px;
    letter-spacing: 0.02em;
    color: #93a0b5;
  }

  /* 新闻区的提示行（拉不到列表 / 还没建 news 文件夹时才有字） */
  .news-hint {
    margin: -12px 0 22px;
    font-size: 13px;
    line-height: 1.7;
    color: #93a0b5;
  }

  /* 滚到浅色页面（新闻/游戏）时，右上角按钮从"深色玻璃"换成"白色卡片" */
  body.on-light {
    --pill-bg: rgba(255, 255, 255, 0.92);
    --pill-bg-hover: #ffffff;
    --pill-border: rgba(20, 30, 50, 0.14);
    --pill-border-hover: rgba(20, 30, 50, 0.24);
    --pill-fg: #16233a;
    --pill-shadow: 0 6px 22px rgba(20, 30, 50, 0.14),
                   inset 0 1px 0 rgba(255, 255, 255, 0.9);
  }

  /* 但深色模式下新闻/游戏页本身也是深色，按钮就别变白了 */
  html.dark body.on-light {
    --pill-bg: rgba(30, 38, 52, 0.72);
    --pill-bg-hover: rgba(44, 54, 72, 0.88);
    --pill-border: rgba(255, 255, 255, 0.18);
    --pill-border-hover: rgba(255, 255, 255, 0.3);
    --pill-fg: #eaf1f8;
    --pill-shadow: 0 6px 22px rgba(0, 0, 0, 0.45),
                   inset 0 1px 0 rgba(255, 255, 255, 0.14);
  }

  /* ================= 新闻详情弹层 ================= */
  .news-modal {
    position: fixed;
    inset: 0;
    z-index: 100;          /* 要盖过右上角的登录按钮(z-index:10) */
    display: none;
    align-items: center;
    justify-content: center;
    padding: 22px;
  }

  .news-modal.open { display: flex; }

  .news-modal-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(8, 12, 22, 0.62);
    backdrop-filter: blur(7px);
    -webkit-backdrop-filter: blur(7px);
    animation: fadeIn 0.25s ease both;
  }

  .news-modal-card {
    position: relative;
    width: min(720px, 100%);
    max-height: min(86vh, 920px);
    overflow: hidden auto;
    overscroll-behavior: contain;
    border-radius: 22px;
    background: #fff;
    color: #172033;
    font-family: var(--font-cn);
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
    animation: modalIn 0.32s cubic-bezier(0.22, 0.61, 0.36, 1) both;
  }

  @keyframes modalIn {
    from { opacity: 0; transform: translateY(22px) scale(0.97); }
    to   { opacity: 1; transform: none; }
  }

  .news-modal-close {
    position: absolute;
    top: 12px;
    right: 12px;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    font-family: inherit;
    font-size: 20px;
    line-height: 1;
    color: #fff;
    cursor: pointer;
    border: 0;
    border-radius: 50%;
    background: rgba(12, 18, 30, 0.5);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    transition: background 0.18s;
  }

  .news-modal-close:hover { background: rgba(12, 18, 30, 0.78); }

  /* 详情页的图：整宽横幅。max-height 限制高度，免得图把正文挤下去。
     想完整显示不裁切，把下面的 object-fit: cover 改成 contain */
  .news-modal-hero {
    position: relative;      /* 让左右箭头和计数器相对图片定位 */
    aspect-ratio: 16 / 10;
    max-height: 52vh;
    overflow: hidden;
    background: #eef2f8;
  }

  .news-modal-hero img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 50% 30%;   /* 裁切往上偏，别切到人物头部 */
  }

  /* 左右切换配图：箭头用边框画，不依赖字体里有没有 ‹ › */
  .news-nav {
    position: absolute;
    top: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    padding: 0;
    cursor: pointer;
    border: 0;
    border-radius: 50%;
    background: rgba(12, 18, 30, 0.42);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    transform: translateY(-50%);
    transition: background 0.18s;
  }

  .news-nav:hover { background: rgba(12, 18, 30, 0.74); }

  .news-nav i {
    width: 9px;
    height: 9px;
    border-top: 2px solid #fff;
    border-right: 2px solid #fff;
  }

  .news-nav--prev { left: 12px; }
  .news-nav--prev i { transform: rotate(-135deg) translate(-1px, -1px); }
  .news-nav--next { right: 12px; }
  .news-nav--next i { transform: rotate(45deg) translate(-1px, -1px); }

  .news-counter {
    position: absolute;
    right: 12px;
    bottom: 12px;
    padding: 3px 10px;
    font-size: 12px;
    color: #fff;
    border-radius: 99px;
    background: rgba(12, 18, 30, 0.5);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }

  /* 配图缩略图条 */
  .news-modal-thumbs {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 14px 30px 0;
  }

  .news-modal-thumbs button {
    width: 62px;
    height: 62px;
    padding: 0;
    overflow: hidden;
    cursor: pointer;
    border: 2px solid transparent;
    border-radius: 10px;
    background: #eef2f8;
    transition: border-color 0.18s, transform 0.18s;
  }

  .news-modal-thumbs button:hover { transform: translateY(-2px); }
  .news-modal-thumbs button.is-active { border-color: #7fc4ff; }

  .news-modal-thumbs img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .news-modal-date {
    margin-top: 10px;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: #93a0b5;
    text-align: center;
  }

  .news-loading {
    color: #93a0b5;
  }

  .news-modal-body { padding: 26px 30px 42px; }

  .news-modal-title {
    font-size: clamp(22px, 3.4vw, 30px);
    font-weight: 800;
    line-height: 1.4;
    text-align: center;      /* 标题居中 */
  }

  /* 标题和正文之间空出一行 */
  .news-modal-text {
    margin-top: 1.9em;
    font-size: 16px;
    line-height: 1.95;
    color: #35415a;
  }

  .news-modal-text p + p { margin-top: 1.05em; }

  @media (max-width: 560px) {
    .news-modal { padding: 12px; }
    .news-modal-body { padding: 20px 20px 32px; }
    .news-modal-card { max-height: 90vh; }
  }

  /* docx 正文里插的图 */
  .news-modal-text img {
    display: block;
    max-width: 100%;
    height: auto;
    margin: 1.5em auto;
    border-radius: 12px;
    cursor: zoom-in;
    box-shadow: 0 6px 20px rgba(23, 32, 51, 0.12);
  }

  .news-modal-hero img { cursor: zoom-in; }

  /* ================= 点图看原图（灯箱） ================= */
  .lightbox {
    position: fixed;
    inset: 0;
    z-index: 200;            /* 要盖过新闻弹层(100) */
    display: none;
    align-items: center;
    justify-content: center;
  }

  .lightbox.open { display: flex; }

  .lightbox-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(6, 10, 18, 0.93);
    animation: fadeIn 0.2s ease both;
  }

  .lightbox-img {
    position: relative;
    max-width: 94vw;
    max-height: 88vh;
    object-fit: contain;     /* 完整显示，不裁切 */
    border-radius: 8px;
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.7);
    cursor: zoom-out;
    animation: modalIn 0.26s cubic-bezier(0.22, 0.61, 0.36, 1) both;
  }

  .lightbox-close {
    position: absolute;
    top: 16px;
    right: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    font-family: inherit;
    font-size: 24px;
    line-height: 1;
    color: #fff;
    cursor: pointer;
    border: 0;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.14);
    transition: background 0.18s;
  }

  .lightbox-close:hover { background: rgba(255, 255, 255, 0.28); }

  .lightbox-nav {
    position: absolute;
    top: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 46px;
    height: 46px;
    padding: 0;
    cursor: pointer;
    border: 0;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.14);
    transform: translateY(-50%);
    transition: background 0.18s;
  }

  .lightbox-nav:hover { background: rgba(255, 255, 255, 0.3); }

  .lightbox-nav i {
    width: 11px;
    height: 11px;
    border-top: 2px solid #fff;
    border-right: 2px solid #fff;
  }

  .lightbox-nav--prev { left: 16px; }
  .lightbox-nav--prev i { transform: rotate(-135deg) translate(-1px, -1px); }
  .lightbox-nav--next { right: 16px; }
  .lightbox-nav--next i { transform: rotate(45deg) translate(-1px, -1px); }

  .lightbox-counter {
    position: absolute;
    left: 50%;
    bottom: 18px;
    padding: 4px 13px;
    font-size: 13px;
    color: #fff;
    border-radius: 99px;
    background: rgba(255, 255, 255, 0.16);
    transform: translateX(-50%);
  }

  /* ================= 游戏页（淡青） ================= */
  .games {
    position: relative;
    z-index: 6;                /* 比新闻页(5)高，滚上来盖住新闻 */
    min-height: 100vh;
    padding: 0 22px 90px;
    background: #e4f4f3;
    color: #10333a;
    font-family: var(--font-cn);
    border-radius: calc((1 - var(--reveal, 0)) * 30px)
                   calc((1 - var(--reveal, 0)) * 30px) 0 0;
    box-shadow: 0 calc(var(--reveal, 0) * -6px) 60px rgba(0, 0, 0, 0.45);
  }

  .games-grabber {
    width: 46px;
    height: 5px;
    margin: 0 auto;
    border-radius: 99px;
    background: rgba(16, 51, 58, 0.16);
    transform: translateY(14px);
    opacity: calc(1 - var(--reveal, 0) * 0.7);
  }

  .games-inner {
    max-width: 1100px;
    margin: 0 auto;
    padding-top: 74px;
    opacity: 0;
    transform: translateY(26px);
    transition: opacity 0.55s ease 0.1s, transform 0.55s cubic-bezier(0.22, 0.61, 0.36, 1) 0.1s;
  }

  .games.is-ready .games-inner { opacity: 1; transform: none; }

  .games-heading {
    font-size: clamp(30px, 5vw, 46px);
    font-weight: 800;
    letter-spacing: 0.04em;
    color: #0d3a3f;
  }

  .games-heading::after {
    content: "";
    display: block;
    width: 52px;
    height: 4px;
    margin-top: 14px;
    border-radius: 99px;
    background: linear-gradient(90deg, #57b8b0, #a5ded8);
  }

  .games-sub {
    margin: 18px 0 30px;
    font-size: 14px;
    line-height: 1.7;
    color: #5d7d80;
  }

  /* 横向排开的一排卡片 */
  .games-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 22px;
  }

  /* 卡片内部竖向：图标 → 标题 → 官网按钮 */
  .game-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    width: 250px;
    max-width: 100%;
    padding: 28px 22px 24px;
    text-align: center;
    border: 1px solid rgba(16, 51, 58, 0.08);
    border-radius: 20px;
    background: #fff;
    box-shadow: 0 10px 26px rgba(16, 51, 58, 0.07);
    opacity: 0;
    transform: translateY(18px);
    transition: opacity 0.5s ease 0.18s,
                transform 0.5s cubic-bezier(0.22, 0.61, 0.36, 1) 0.18s,
                box-shadow 0.28s ease;
  }

  .games.is-ready .game-card { opacity: 1; transform: none; }

  .games.is-ready .game-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 18px 40px rgba(16, 51, 58, 0.14);
  }

  /* 图标底统一用黑色：白色的 logo 在浅底上会隐形，
     而卡拉彼丘那个 logo 自带黑底，用黑底才能跟它无缝接上 */
  .game-icon {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 96px;
    height: 96px;
    padding: 12px;
    overflow: hidden;
    border-radius: 24px;
    background: #000;
    box-shadow: 0 6px 16px rgba(16, 51, 58, 0.2);
  }

  .game-icon img {
    position: relative;
    z-index: 1;
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;      /* logo 完整显示，宽版字标也不会被裁掉 */
  }

  /* 整张照片类的图就用 cover 铺满 */
  .game-icon--cover { padding: 0; }
  .game-icon--cover img { object-fit: cover; }

  /* 竖长条 / 横长条的图标：把格子也拉长，不然缩在方格里太小。
     加这两个类是加载完图片后按实际宽高比自动判断的 */
  .game-icon--tall { height: 132px; }
  .game-icon--wide { width: 132px; }

  /* 图还没传上来时显示的字母占位 */
  .game-icon-fallback {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    font-weight: 800;
    color: rgba(255, 255, 255, 0.72);
  }

  .game-title {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 0.02em;
  }

  /* 端游 / 手游 两个按钮并排 */
  .game-links {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
  }

  .game-link {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 8px 15px;
    font-size: 12.5px;
    font-weight: 600;
    text-decoration: none;
    color: #fff;
    border-radius: 99px;
    background: #2f8f89;
    transition: background 0.18s, transform 0.12s;
  }

  .game-link:hover { background: #25726d; transform: translateY(-1px); }

  /* 次要按钮：淡青底 + 青绿字 */
  .game-link--ghost {
    color: #2b7d77;
    background: rgba(47, 143, 137, 0.12);
  }

  .game-link--ghost:hover { background: rgba(47, 143, 137, 0.22); }

  .game-link--muted {
    color: #78989b;
    background: rgba(16, 51, 58, 0.07);
    cursor: default;
  }

  .game-link--muted:hover {
    background: rgba(16, 51, 58, 0.07);
    transform: none;
  }

  @media (max-width: 560px) {
    .lightbox-nav { width: 38px; height: 38px; }
    .lightbox-nav--prev { left: 8px; }
    .lightbox-nav--next { right: 8px; }
    .game-card { width: 100%; }
  }

  /* ================================================================
     深色模式
     由右上角那个圆形按钮切换，选择记在 localStorage 的 "theme" 里。
     给 <html> 加 .dark 类就整套生效（页面打开时最早那行脚本会先加好，不闪白）。
     ================================================================ */
  html.dark {
    color-scheme: dark;
    background: #0b0f14;
  }

  html.dark body { background: #0b0f14; }

  /* ---------- 新闻页：白纸 → 深色卡纸 ---------- */
  html.dark .news {
    background: #151a21;
    color: #e6ecf2;
  }

  html.dark .news-heading { color: #f0f5fa; }
  html.dark .news-heading::after { background: linear-gradient(90deg, #4a7fb0, #7cb2dd); }
  html.dark .news-grabber { background: rgba(255, 255, 255, 0.16); }

  html.dark .news-hint,
  html.dark .news-card-date,
  html.dark .news-modal-date,
  html.dark .news-loading { color: #7f8d9e; }

  html.dark .news-card {
    background: #1b212a;
    border-color: rgba(255, 255, 255, 0.07);
    box-shadow: 0 10px 26px rgba(0, 0, 0, 0.45);
  }

  html.dark .news.is-ready .news-card:hover {
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.6);
  }

  html.dark .news-card-title { color: #eaf0f6; }
  html.dark .news-card-text { color: #9aa8b8; }
  html.dark .news-thumb { background: #232a34; }

  /* ---------- 新闻详情弹层 ---------- */
  html.dark .news-modal-card {
    background: #1a2029;
    color: #e6ecf2;
  }

  html.dark .news-modal-hero { background: #232a34; }
  html.dark .news-modal-title { color: #f0f5fa; }
  html.dark .news-modal-text { color: #b9c5d3; }
  html.dark .news-modal-text img { box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5); }

  html.dark .news-modal-thumbs button { background: #232a34; }
  html.dark .news-modal-thumbs button.is-active { border-color: #6db3e8; }

  /* ---------- 游戏页：淡青 → 深青 ---------- */
  html.dark .games {
    background: #0f1c1e;
    color: #cfe6e4;
  }

  html.dark .games-grabber { background: rgba(255, 255, 255, 0.16); }
  html.dark .games-heading { color: #d9efec; }
  html.dark .games-heading::after { background: linear-gradient(90deg, #3f9a92, #7fd0c8); }
  html.dark .games-sub { color: #7fa3a1; }

  html.dark .game-card {
    background: #16262a;
    border-color: rgba(255, 255, 255, 0.07);
    box-shadow: 0 10px 26px rgba(0, 0, 0, 0.45);
  }

  html.dark .games.is-ready .game-card:hover {
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.6);
  }

  html.dark .game-title { color: #e2f2f0; }

  html.dark .game-link--ghost {
    color: #8ad9d1;
    background: rgba(138, 217, 209, 0.14);
  }

  html.dark .game-link--ghost:hover { background: rgba(138, 217, 209, 0.24); }

  html.dark .game-link--muted {
    color: #7b939a;
    background: rgba(255, 255, 255, 0.07);
  }

  html.dark .game-link--muted:hover { background: rgba(255, 255, 255, 0.07); }

  /* ---------- 图加载失败时的灰底占位，深色版 ---------- */
  html.dark .news-thumb img.is-broken,
  html.dark .news-modal-hero img.is-broken,
  html.dark .news-modal-thumbs img.is-broken {
    background: repeating-linear-gradient(45deg, #232a34 0 12px, #1b222b 12px 24px);
  }

  /* 尊重系统的“减少动态效果”偏好 */
  @media (prefers-reduced-motion: reduce) {
    .bg      { animation: none; opacity: 1; transform: none; filter: none; }
    .overlay { animation: none; opacity: 1; }
    .title   { animation: none; opacity: 1; }
    .char    { animation: none; opacity: 1; transform: none; }
    .cursor  { animation: none; }
    .auth-btn { animation: none; }
    .theme-btn { animation: none; }
    .auth.open .auth-panel { animation: none; }
    .scroll-hint { animation: none; opacity: 1; }
    .scroll-hint i { animation: none; }
    .news-inner, .news-card { transition: none; opacity: 1; transform: none; }
    .news-modal-backdrop, .news-modal-card { animation: none; }
    .games-inner, .game-card { transition: none; opacity: 1; transform: none; }
    .lightbox-backdrop, .lightbox-img { animation: none; }
  }
</style>
<script>
  /* 尽早把主题定下来，避免刷新时闪一下白。
     优先用你上次手动选的，没选过就跟随系统设置。 */
  (function () {
    try {
      var saved = localStorage.getItem("theme");
      var dark = saved
        ? saved === "dark"
        : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
      if (dark) document.documentElement.classList.add("dark");
    } catch (e) { /* 隐私模式下 localStorage 可能读不了，忽略即可 */ }
  })();
</script>
</head>
<body>

  <div class="bg"></div>
  <div class="overlay"></div>

  <div class="anchor">
    <h1 class="title">
      <span id="typed" aria-label="你好，我是烧饼114"></span><span class="cursor" id="cursor"></span>
    </h1>
  </div>

  <!-- ================= 右上角登录入口 ================= -->
  <div class="auth" id="auth">
    <button class="theme-btn" id="themeBtn" type="button" aria-label="切换深色模式" title="切换深色模式">
      <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
      <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="4.3"/>
        <path d="M12 2.2v2.4M12 19.4v2.4M2.2 12h2.4M19.4 12h2.4M5.1 5.1l1.7 1.7M17.2 17.2l1.7 1.7M18.9 5.1l-1.7 1.7M6.8 17.2l-1.7 1.7"/>
      </svg>
    </button>

    <button class="auth-btn" id="authBtn" type="button" aria-haspopup="dialog" aria-expanded="false">
      <span class="auth-avatar" id="authAvatar" hidden></span>
      <span id="authLabel">登录</span>
    </button>

    <div class="auth-panel" id="authPanel" role="dialog" aria-label="账号">
      <div class="auth-head">
        <div>
          <div class="auth-title" id="authTitle">登录</div>
          <div class="auth-sub" id="authSub">用邮箱和密码登录</div>
        </div>
        <button class="auth-close" id="authClose" type="button" aria-label="关闭">&times;</button>
      </div>

      <div class="auth-tabs" id="authTabs">
        <button class="auth-tab is-active" type="button" data-mode="signin">登录</button>
        <button class="auth-tab" type="button" data-mode="signup">注册</button>
      </div>

      <form class="auth-form" id="authForm" novalidate>
        <label class="auth-field">
          <span>邮箱</span>
          <input type="email" id="authEmail" autocomplete="email" placeholder="you@example.com">
        </label>
        <label class="auth-field">
          <span>密码</span>

<script>
  /* ================= 逐字打字动画 ================= */
  (function () {
    var TEXT = "你好，我是烧饼114";
    var SPEED = 110;        // 每个字的间隔（毫秒），越小越快
    var START_DELAY = 1550; // 等背景淡入后再开始打字

    var typed = document.getElementById("typed");
    var cursor = document.getElementById("cursor");
    var reduceMotion = window.matchMedia &&
      window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    // 系统开启“减少动态效果”时，直接整句显示
    if (reduceMotion) {
      typed.textContent = TEXT;
      cursor.classList.add("done");
      return;
    }

    var i = 0;
    function next() {
      if (i >= TEXT.length) {
        cursor.classList.add("done");
        return;
      }
      var ch = TEXT.charAt(i);
      var span = document.createElement("span");
      span.className = "char";
      span.textContent = ch === " " ? "\u00A0" : ch;
      typed.appendChild(span);
      i++;
      setTimeout(next, SPEED);
    }

    setTimeout(next, START_DELAY);
  })();
</script>

<script>
  /* ================================================================
     分屏：新闻页（白）和游戏页（淡青）随滚动把底色推上来
     给任意 <section> 加 data-reveal 就会自动生效
     ================================================================ */
  (function () {
    var sections = Array.prototype.slice.call(document.querySelectorAll("[data-reveal]"));
    if (!sections.length) return;

    var reduceMotion = window.matchMedia &&
      window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var ticking = false;

    function update() {
      ticking = false;
      var vh = window.innerHeight || 1;
      var onLight = false;

      sections.forEach(function (sec) {
        // 0 = 这块还在视口下方；1 = 它的上边缘已贴到视口顶部（底色铺满）
        var top = sec.getBoundingClientRect().top;
        var p = (vh - top) / vh;
        if (p < 0) p = 0;
        if (p > 1) p = 1;

        // 驱动圆角、阴影、顶部小横杠
        sec.style.setProperty("--reveal", p.toFixed(3));
        if (p > 0.62) onLight = true;

        if (reduceMotion) return;   // 减少动态效果时内容常驻，不做播放/收起

        // 铺满 → 内容出来；滑回上一屏 → 收回去，下次滑下来重播。
        // 两个不同阈值(0.96 / 0.15)做回滞，免得小幅滚动时反复闪。
        if (p >= 0.96 && !sec.__on) {
          sec.__on = true;
          sec.classList.add("is-ready");
        } else if (p <= 0.15 && sec.__on) {
          sec.__on = false;
          sec.classList.remove("is-ready");
        }
      });

      // 浅色页面盖住屏幕时，右上角按钮换成浅色样式
      document.body.classList.toggle("on-light", onLight);
    }

    function onScroll() {
      if (!ticking) {
        ticking = true;
        window.requestAnimationFrame(update);
      }
    }

    window.addEventListener("scroll", onScroll, { passive: true });
    window.addEventListener("resize", onScroll, { passive: true });
    if (reduceMotion) sections.forEach(function (s) { s.classList.add("is-ready"); });
    update();   // 刷新后可能停在中间，先算一次
  })();

  /* ================= 深色模式开关 ================= */
  (function () {
    var btn = document.getElementById("themeBtn");
    var root = document.documentElement;
    if (!btn) return;

    function refresh() {
      var dark = root.classList.contains("dark");
      var text = dark ? "切换到浅色模式" : "切换到深色模式";
      btn.setAttribute("aria-label", text);
      btn.title = text;
    }
    refresh();

    btn.addEventListener("click", function () {
      var dark = !root.classList.contains("dark");
      root.classList.toggle("dark", dark);
      try { localStorage.setItem("theme", dark ? "dark" : "light"); } catch (e) {}
      refresh();
    });

    // 没手动选过的话，跟着系统设置变
    if (window.matchMedia) {
      var mq = window.matchMedia("(prefers-color-scheme: dark)");
      var onChange = function (e) {
        var saved = null;
        try { saved = localStorage.getItem("theme"); } catch (err) {}
        if (saved) return;                       // 手动选过就以手动为准
        root.classList.toggle("dark", e.matches);
        refresh();
      };
      if (mq.addEventListener) mq.addEventListener("change", onChange);
      else if (mq.addListener) mq.addListener(onChange);
    }
  })();

  /* ================= 游戏图标：没图才显示字母占位 ================= */
  (function () {
    Array.prototype.forEach.call(document.querySelectorAll(".game-icon img"), function (img) {
      var box = img.parentNode;
      var fb = box.querySelector(".game-icon-fallback");

      function showLetter() { img.hidden = true; if (fb) fb.hidden = false; }
      function hideLetter() {
        if (fb) fb.hidden = true;              // 图加载出来就把字母藏掉
        fitBox();
      }
      // 竖长条/横长条的图标，把格子也拉长，否则缩在方格里太小
      function fitBox() {
        if (!img.naturalWidth) return;
        var r = img.naturalHeight / img.naturalWidth;
        if (r > 1.35) box.classList.add("game-icon--tall");
        else if (r < 0.7) box.classList.add("game-icon--wide");
      }

      img.addEventListener("error", showLetter);
      img.addEventListener("load", hideLetter);
      if (img.complete) {                    // 已经加载完（或已失败）的
        if (img.naturalWidth === 0) showLetter(); else hideLetter();
      }
    });
  })();
</script>
