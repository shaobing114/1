<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>你好，我是烧饼114</title>
<style>
  /* ===== 想调整文字位置，只改这两个值即可 =====
     50% / 50% = 正中；想放到左侧空白处试试 34% / 46% */
  :root {
    --text-x: 50%;
    --text-y: 50%;
    --font-cn: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB",
               "Noto Sans SC", system-ui, -apple-system, sans-serif;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  [hidden] { display: none !important; }

  html, body {
    width: 100%;
    background: #0b0b0f; /* 图片加载前的底色，避免白屏闪烁 */
  }

  /* 页面现在要能纵向滚动：第一屏是主页，往下是新闻页 */
  body {
    overflow-x: hidden;
    color: #172033;
  }

  /* ===== 背景图层：打开网页时淡入 ===== */
  .bg {
    position: fixed;
    inset: 0;
    background-image: url("./壁纸.png");
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    opacity: 0;
    transform: scale(1.08);
    animation: bgFadeIn 1.8s cubic-bezier(0.22, 0.61, 0.36, 1) 0.15s forwards;
    will-change: opacity, transform;
  }

  @keyframes bgFadeIn {
    0% {
      opacity: 0;
      transform: scale(1.08);
      filter: blur(6px);
    }
    60% {
      filter: blur(2px);
    }
    100% {
      opacity: 1;
      transform: scale(1);
      filter: blur(0);
    }
  }

  /* 四周压暗，让画面更有氛围、文字更突出 */
  .overlay {
    position: fixed;
    inset: 0;
    background: radial-gradient(
      ellipse at center,
      rgba(0, 0, 0, 0.05) 0%,
      rgba(0, 0, 0, 0.40) 100%
    );
    opacity: 0;
    animation: fadeIn 1.8s ease 0.45s forwards;
    pointer-events: none;
  }

  @keyframes fadeIn {
    to { opacity: 1; }
  }

  /* ===== 文字锚点：由 --text-x / --text-y 决定位置 ===== */
  .anchor {
    position: fixed;
    left: var(--text-x);
    top: var(--text-y);
    transform: translate(-50%, -50%);
    z-index: 2;
    max-width: 92vw;
  }

  /* ===== 文字本体 ===== */
  .title {
    position: relative;
    font-family: var(--font-cn);
    font-size: clamp(26px, 6.5vw, 76px);
    font-weight: 700;
    letter-spacing: 0.06em;
    line-height: 1.3;
    text-align: center;
    color: #ffffff;
    /* 只有笔画周围压暗，不遮画面本身，白字在任何底色上都清楚 */
    text-shadow:
      0 0 8px rgba(0, 0, 0, 0.70),
      0 3px 14px rgba(0, 0, 0, 0.70),
      0 6px 28px rgba(0, 0, 0, 0.50);
    /* 等背景淡入差不多结束再开始逐字跳出 */
    opacity: 0;
    animation: titleShow 0.01s linear 1.5s forwards;
  }

  @keyframes titleShow {
    to { opacity: 1; }
  }

  #typed { display: inline; }

  /* 每个字：快速上浮 + 放大回弹 + 淡入 */
  .char {
    display: inline-block;
    opacity: 0;
    transform: translateY(0.45em) scale(0.9);
    animation: charPop 0.34s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
  }

  @keyframes charPop {
    to {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  /* 光标 */
  .cursor {
    display: inline-block;
    width: 0.06em;
    height: 1.05em;
    min-width: 3px;
    margin-left: 0.06em;
    vertical-align: -0.14em;
    background: #ffffff;
    box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
    animation: blink 0.72s steps(1) infinite;
  }

  @keyframes blink {
    0%, 49%   { opacity: 1; }
    50%, 100% { opacity: 0; }
  }

  /* 打完字后光标再闪几下就停住 */
  .cursor.done {
    animation: blink 0.72s steps(1) 4;
  }

  /* ================= 右上角登录入口 ================= */
  .auth {
    position: fixed;
    top: 18px;
    right: 18px;
    z-index: 10;
    font-family: var(--font-cn);
    -webkit-tap-highlight-color: transparent;
  }

  /* 毛玻璃胶囊按钮 */
  .auth-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    height: 40px;
    padding: 0 16px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: #fff;
    cursor: pointer;
    border: 1px solid rgba(255, 255, 255, 0.22);
    border-radius: 999px;
    background: rgba(18, 24, 40, 0.42);
    backdrop-filter: blur(12px) saturate(140%);
    -webkit-backdrop-filter: blur(12px) saturate(140%);
    box-shadow: 0 6px 22px rgba(0, 0, 0, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.18);
    transition: background 0.2s ease, border-color 0.2s ease, transform 0.12s ease;
    animation: dropIn 0.6s cubic-bezier(0.22, 0.61, 0.36, 1) 1.1s both;
  }

  .auth-btn:hover {
    background: rgba(30, 40, 66, 0.62);
    border-color: rgba(255, 255, 255, 0.34);
  }

  .auth-btn:active { transform: scale(0.97); }

  .auth-btn:focus-visible {
    outline: 2px solid rgba(140, 200, 255, 0.9);
    outline-offset: 2px;
  }

  @keyframes dropIn {
    from { opacity: 0; transform: translateY(-10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .auth-avatar {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    font-size: 12px;
    font-weight: 700;
    color: #0b1220;
    background: linear-gradient(140deg, #bfe3ff, #7fc4ff);
  }

  /* 下拉面板 */
  .auth-panel {
    display: none;
    position: absolute;
    top: calc(100% + 10px);
    right: 0;
    width: min(322px, calc(100vw - 36px));
    padding: 18px;
    color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 16px;
    background: rgba(14, 19, 32, 0.66);
    backdrop-filter: blur(18px) saturate(150%);
    -webkit-backdrop-filter: blur(18px) saturate(150%);
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.14);
    transform-origin: top right;
  }

  .auth.open .auth-panel {
    display: block;
    animation: panelIn 0.2s cubic-bezier(0.22, 0.61, 0.36, 1);
  }

  @keyframes panelIn {
    from { opacity: 0; transform: translateY(-8px) scale(0.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .auth-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 14px;
  }

  .auth-title { font-size: 16px; font-weight: 700; }

  .auth-sub {
    margin-top: 3px;
    font-size: 12px;
    color: rgba(255, 255, 255, 0.6);
  }

  .auth-close {
    padding: 4px;
    font-size: 17px;
    line-height: 1;
    color: rgba(255, 255, 255, 0.6);
    cursor: pointer;
    border: 0;
    border-radius: 8px;
    background: transparent;
    transition: 0.18s;
  }

  .auth-close:hover { color: #fff; background: rgba(255, 255, 255, 0.1); }

  /* 登录 / 注册 切换 */
  .auth-tabs {
    display: flex;
    gap: 4px;
    padding: 3px;
    margin-bottom: 14px;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.07);
  }

  .auth-tab {
    flex: 1;
    padding: 7px 0;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.62);
    cursor: pointer;
    border: 0;
    border-radius: 8px;
    background: transparent;
    transition: 0.18s;
  }

  .auth-tab.is-active {
    color: #0b1220;
    background: linear-gradient(140deg, #eaf4ff, #b9dcff);
  }

  .auth-form { display: flex; flex-direction: column; gap: 11px; }

  .auth-field {
    display: flex;
    flex-direction: column;
    gap: 5px;
    font-size: 12px;
    color: rgba(255, 255, 255, 0.66);
  }

  .auth-field input {
    height: 38px;
    padding: 0 11px;
    font-family: inherit;
    font-size: 14px;
    color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.07);
    transition: border-color 0.18s, background 0.18s;
  }

  .auth-field input::placeholder { color: rgba(255, 255, 255, 0.34); }

  .auth-field input:focus {
    outline: none;
    border-color: rgba(140, 200, 255, 0.75);
    background: rgba(255, 255, 255, 0.11);
  }

  .auth-submit {
    height: 40px;
    margin-top: 3px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: #0b1220;
    cursor: pointer;
    border: 0;
    border-radius: 10px;
    background: linear-gradient(140deg, #eaf4ff, #a8d4ff);
    box-shadow: 0 6px 18px rgba(120, 190, 255, 0.28);
    transition: filter 0.18s, transform 0.12s;
  }

  .auth-submit:hover { filter: brightness(1.06); }
  .auth-submit:active { transform: scale(0.985); }
  .auth-submit:disabled { opacity: 0.55; cursor: default; filter: none; transform: none; }

  /* GitHub 登录 */
  .auth-or {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 13px 0 11px;
    font-size: 11px;
    color: rgba(255, 255, 255, 0.42);
  }

  .auth-or::before,
  .auth-or::after {
    content: "";
    flex: 1;
    height: 1px;
    background: rgba(255, 255, 255, 0.14);
  }

  .auth-gh {
    width: 100%;
    height: 38px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    color: #fff;
    cursor: pointer;
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.07);
    transition: 0.18s;
  }

  .auth-gh:hover { background: rgba(255, 255, 255, 0.14); }

  /* 提示信息 */
  .auth-msg {
    margin-top: 11px;
    font-size: 12px;
    line-height: 1.5;
    color: rgba(255, 255, 255, 0.7);
  }

  .auth-msg:empty { display: none; }
  .auth-msg.is-error { color: #ffb4b4; }
  .auth-msg.is-ok    { color: #9ff0c4; }
  .auth-msg.is-warn  { color: #ffd89b; }

  /* 已登录状态 */
  .auth-user { display: flex; flex-direction: column; gap: 11px; }

  .auth-signout {
    height: 38px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    color: #fff;
    cursor: pointer;
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.07);
    transition: 0.18s;
  }

  .auth-signout:hover {
    background: rgba(255, 120, 120, 0.18);
    border-color: rgba(255, 140, 140, 0.42);
  }

  @media (max-width: 480px) {
    .auth { top: 14px; right: 14px; }
    .auth-btn { height: 36px; padding: 0 13px; font-size: 13px; }
  }

  /* ================= 个人中心（登录后显示） ================= */
  .profile {
    display: flex;
    align-items: center;
    gap: 11px;
    padding-bottom: 13px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.12);
  }

  .profile-avatar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    font-size: 18px;
    font-weight: 700;
    color: #0b1220;
    background: linear-gradient(140deg, #bfe3ff, #7fc4ff);
  }

  .profile-info { min-width: 0; }

  .profile-name {
    font-size: 15px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .profile-email {
    margin-top: 2px;
    font-size: 12px;
    color: rgba(255, 255, 255, 0.58);
    word-break: break-all;
  }

  .profile-tip {
    font-size: 11px;
    line-height: 1.5;
    color: rgba(255, 255, 255, 0.45);
  }

  /* ================= 第一屏 + 向下滑动提示 ================= */
  .hero {
    position: relative;
    z-index: 1;
    height: 100vh;
    height: 100svh;   /* 手机上避开地址栏抖动 */
  }

  .scroll-hint {
    position: absolute;
    left: 50%;
    bottom: 26px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 7px;
    font-family: var(--font-cn);
    font-size: 12px;
    letter-spacing: 0.16em;
    color: rgba(255, 255, 255, 0.72);
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
    transform: translateX(-50%);
    animation: hintIn 1s ease 2.6s both;
    pointer-events: none;
  }

  @keyframes hintIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  /* 用边框画一个小箭头，省得引图标 */
  .scroll-hint i {
    width: 9px;
    height: 9px;
    border-right: 2px solid rgba(255, 255, 255, 0.8);
    border-bottom: 2px solid rgba(255, 255, 255, 0.8);
    transform: rotate(45deg);
    animation: hintBob 1.6s ease-in-out infinite;
  }

  @keyframes hintBob {
    0%, 100% { transform: rotate(45deg) translate(0, 0); opacity: 0.55; }
    50%      { transform: rotate(45deg) translate(3px, 3px); opacity: 1; }
  }

  /* ================= 新闻页：随滚动推上来的白底 ================= */
  .news {
    position: relative;
    z-index: 5;                 /* 高于标题(2)，所以滚上来会把主页盖住 */
    min-height: 100vh;
    padding: 0 22px 90px;
    background: #ffffff;
    color: #172033;
    font-family: var(--font-cn);
    /* --reveal 由滚动位置驱动：0 = 还在屏幕下方，1 = 完全铺满 */
    border-radius: calc((1 - var(--reveal, 0)) * 30px)
                   calc((1 - var(--reveal, 0)) * 30px) 0 0;
    box-shadow: 0 calc(var(--reveal, 0) * -6px) 60px rgba(0, 0, 0, 0.45);
  }

  /* 顶部那条小横杠，看着像"抽上来的一张纸" */
  .news-grabber {
    width: 46px;
    height: 5px;
    margin: 0 auto;
    border-radius: 99px;
    background: rgba(23, 32, 51, 0.14);
    transform: translateY(14px);
    opacity: calc(1 - var(--reveal, 0) * 0.7);
  }

  /* 内容默认藏着，等白底铺满再加 .is-ready 才出来 */
  .news-inner {
    max-width: 1100px;
    margin: 0 auto;
    padding-top: 74px;
    opacity: 0;
    transform: translateY(26px);
    transition: opacity 0.55s ease 0.1s, transform 0.55s cubic-bezier(0.22, 0.61, 0.36, 1) 0.1s;
  }

  .news.is-ready .news-inner {
    opacity: 1;
    transform: none;
  }

  .news-heading {
    margin-bottom: 26px;
    font-size: clamp(30px, 5vw, 46px);
    font-weight: 800;
    letter-spacing: 0.04em;
  }

  /* 透明横条只作装饰，给标题一点节奏 */
  .news-heading::after {
    content: "";
    display: block;
    width: 52px;
    height: 4px;
    margin-top: 14px;
    border-radius: 99px;
    background: linear-gradient(90deg, #7fc4ff, #b9dcff);
  }

  /* 上图下文的小方格 */
  .news-grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 22px;
  }

  .news-card {
    width: 320px;
    max-width: 100%;
    overflow: hidden;
    border: 1px solid rgba(23, 32, 51, 0.08);
    border-radius: 20px;
    background: #fff;
    box-shadow: 0 10px 26px rgba(23, 32, 51, 0.08);
    cursor: pointer;
    opacity: 0;
    transform: translateY(18px);
    transition: opacity 0.5s ease 0.18s,
                transform 0.5s cubic-bezier(0.22, 0.61, 0.36, 1) 0.18s,
                box-shadow 0.28s ease;
  }

  .news-card:focus-visible {
    outline: 3px solid rgba(127, 196, 255, 0.9);
    outline-offset: 3px;
  }

  .news.is-ready .news-card {
    opacity: 1;
    transform: none;
  }

  .news.is-ready .news-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 18px 40px rgba(23, 32, 51, 0.14);
  }

  .news-thumb {
    aspect-ratio: 1 / 1;
    overflow: hidden;
    background: #eef2f8;
  }

  .news-thumb img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.5s cubic-bezier(0.22, 0.61, 0.36, 1);
  }

  .news.is-ready .news-card:hover .news-thumb img {
    transform: scale(1.045);
  }

  .news-body { padding: 16px 18px 20px; }

  .news-card-title {
    font-size: 17px;
    font-weight: 700;
    line-height: 1.45;
  }

  .news-card-text {
    margin-top: 7px;
    font-size: 13px;
    line-height: 1.7;
    color: #5c6a80;
  }

  /* 滚到新闻页时，右上角按钮从"深色玻璃"换成"白色卡片"，在浅色背景上更清楚 */
  body.on-news .auth-btn {
    color: #16233a;
    border-color: rgba(20, 30, 50, 0.14);
    background: rgba(255, 255, 255, 0.92);
    box-shadow: 0 6px 22px rgba(20, 30, 50, 0.14),
                inset 0 1px 0 rgba(255, 255, 255, 0.9);
  }

  body.on-news .auth-btn:hover {
    background: #fff;
    border-color: rgba(20, 30, 50, 0.24);
  }

  /* ================= 新闻详情弹层 ================= */
  .news-modal {
    position: fixed;
    inset: 0;
    z-index: 100;          /* 要盖过右上角的登录按钮(z-index:10) */
    display: none;
    align-items: center;
    justify-content: center;
    padding: 22px;
  }

  .news-modal.open { display: flex; }

  .news-modal-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(8, 12, 22, 0.62);
    backdrop-filter: blur(7px);
    -webkit-backdrop-filter: blur(7px);
    animation: fadeIn 0.25s ease both;
  }

  .news-modal-card {
    position: relative;
    width: min(720px, 100%);
    max-height: min(86vh, 920px);
    overflow: hidden auto;
    overscroll-behavior: contain;
    border-radius: 22px;
    background: #fff;
    color: #172033;
    font-family: var(--font-cn);
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
    animation: modalIn 0.32s cubic-bezier(0.22, 0.61, 0.36, 1) both;
  }

  @keyframes modalIn {
    from { opacity: 0; transform: translateY(22px) scale(0.97); }
    to   { opacity: 1; transform: none; }
  }

  .news-modal-close {
    position: absolute;
    top: 12px;
    right: 12px;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    font-family: inherit;
    font-size: 20px;
    line-height: 1;
    color: #fff;
    cursor: pointer;
    border: 0;
    border-radius: 50%;
    background: rgba(12, 18, 30, 0.5);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    transition: background 0.18s;
  }

  .news-modal-close:hover { background: rgba(12, 18, 30, 0.78); }

  /* 详情页的图：整宽横幅。max-height 限制高度，免得图把正文挤下去。
     想完整显示不裁切，把下面的 object-fit: cover 改成 contain */
  .news-modal-hero {
    aspect-ratio: 16 / 10;
    max-height: 52vh;
    overflow: hidden;
    background: #eef2f8;
  }

  .news-modal-hero img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 50% 30%;   /* 裁切往上偏，别切到人物头部 */
  }

  .news-modal-body { padding: 26px 30px 42px; }

  .news-modal-title {
    font-size: clamp(22px, 3.4vw, 30px);
    font-weight: 800;
    line-height: 1.4;
    text-align: center;      /* 标题居中 */
  }

  /* 标题和正文之间空出一行 */
  .news-modal-text {
    margin-top: 1.9em;
    font-size: 16px;
    line-height: 1.95;
    color: #35415a;
  }

  .news-modal-text p + p { margin-top: 1.05em; }

  @media (max-width: 560px) {
    .news-modal { padding: 12px; }
    .news-modal-body { padding: 20px 20px 32px; }
    .news-modal-card { max-height: 90vh; }
  }

  /* 尊重系统的“减少动态效果”偏好 */
  @media (prefers-reduced-motion: reduce) {
    .bg      { animation: none; opacity: 1; transform: none; filter: none; }

<script>
  /* ================= 逐字打字动画 ================= */
  (function () {
    var TEXT = "你好，我是烧饼114";
    var SPEED = 110;        // 每个字的间隔（毫秒），越小越快
    var START_DELAY = 1550; // 等背景淡入后再开始打字

    var typed = document.getElementById("typed");
    var cursor = document.getElementById("cursor");
    var reduceMotion = window.matchMedia &&
      window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    // 系统开启“减少动态效果”时，直接整句显示
    if (reduceMotion) {
      typed.textContent = TEXT;
      cursor.classList.add("done");
      return;
    }

    var i = 0;
    function next() {
      if (i >= TEXT.length) {
        cursor.classList.add("done");
        return;
      }
      var ch = TEXT.charAt(i);
      var span = document.createElement("span");
      span.className = "char";
      span.textContent = ch === " " ? "\u00A0" : ch;
      typed.appendChild(span);
      i++;
      setTimeout(next, SPEED);
    }

    setTimeout(next, START_DELAY);
  })();
</script>

<script>
  /* ================= 新闻页：白底随滚动推上来 ================= */
  (function () {
    var news = document.getElementById("news");
    var root = document.documentElement;
    if (!news) return;

    var reduceMotion = window.matchMedia &&
      window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var ticking = false;
    var revealed = false;

    function update() {
      ticking = false;
      var vh = window.innerHeight || 1;
      var y = window.pageYOffset || root.scrollTop || 0;
      var p = y / vh;
      if (p < 0) p = 0;
      if (p > 1) p = 1;

      // 0 = 白底还在屏幕外，1 = 完全铺满。用来驱动圆角、阴影、小横杠
      root.style.setProperty("--reveal", p.toFixed(3));

      // 滚到新闻页后，右上角按钮换成浅色样式
      document.body.classList.toggle("on-news", p > 0.62);

      if (reduceMotion) return;   // 减少动态效果时内容常驻，不做播放/收起

      // 白底铺满 → 内容出来；滑回顶部附近再下来 → 收回去重播。
      // 用两个不同的阈值（0.96 / 0.15）做回滞，免得在新闻页小幅滚动时反复闪。
      if (p >= 0.96 && !revealed) {
        revealed = true;
        news.classList.add("is-ready");
      } else if (p <= 0.15 && revealed) {
        revealed = false;
        news.classList.remove("is-ready");
      }
    }

    function onScroll() {
      if (!ticking) {
        ticking = true;
        window.requestAnimationFrame(update);
      }
    }

    window.addEventListener("scroll", onScroll, { passive: true });
    window.addEventListener("resize", onScroll, { passive: true });
    if (reduceMotion) news.classList.add("is-ready");
    update();   // 刷新后可能停在中间，先算一次
  })();
</script>

<script>
  /* ================= 新闻详情弹层 ================= */
  (function () {
    var modal = document.getElementById("newsModal");
    if (!modal) return;

    var backdrop = document.getElementById("newsBackdrop");
    var closeBtn = document.getElementById("newsClose");
    var imgSlot = document.getElementById("newsModalImg");
    var titleSlot = document.getElementById("newsModalTitle");
    var textSlot = document.getElementById("newsModalText");
    var lastCard = null;
    var lockedY = 0;

    function lockScroll() {
      lockedY = window.pageYOffset || 0;
      document.documentElement.style.overflow = "hidden";
      document.body.style.overflow = "hidden";
    }

    function unlockScroll() {
      document.documentElement.style.overflow = "";
      document.body.style.overflow = "";
      window.scrollTo(0, lockedY);   // 有的浏览器会跳回顶部，这里补回来
    }

    function open(card) {
      var img = card.querySelector(".news-thumb img");
      var title = card.querySelector(".news-card-title");
      var tpl = card.querySelector("template.news-detail");

      imgSlot.src = img ? img.src : "";
      imgSlot.alt = img ? img.alt : "";
      titleSlot.textContent = title ? title.textContent : "";
      textSlot.innerHTML = tpl ? tpl.innerHTML : "";

      lastCard = card;
      modal.classList.add("open");
      modal.setAttribute("aria-hidden", "false");
      lockScroll();
      closeBtn.focus();
    }

    function close() {
      if (!modal.classList.contains("open")) return;
      modal.classList.remove("open");
      modal.setAttribute("aria-hidden", "true");
      unlockScroll();
      if (lastCard) lastCard.focus();   // 焦点还回卡片，键盘用户不会迷路
    }

    // 卡片：点击 / 回车 / 空格 都能打开
    Array.prototype.forEach.call(document.querySelectorAll(".news-card"), function (card) {
      card.addEventListener("click", function () { open(card); });
      card.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " " || e.key === "Spacebar") {
          e.preventDefault();
          open(card);
        }
      });
    });

    if (backdrop) backdrop.addEventListener("click", close);
    if (closeBtn) closeBtn.addEventListener("click", close);
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") close();
    });
  })();
</script>

  });

  els.close.addEventListener("click", function () { openPanel(false); });

  // 点面板外面 / 按 Esc 关闭
  document.addEventListener("click", function (e) {
    if (!els.auth.contains(e.target)) openPanel(false);
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") openPanel(false);
  });

  /* ---------------- 小工具 ---------------- */
  function msg(text, kind) {
    els.msg.textContent = text || "";
    els.msg.className = "auth-msg" + (kind ? " is-" + kind : "");
  }

  /* 提交按钮的状态完全由 libState 决定：
     库没就绪之前一律禁用并写明原因，绝不出现"看着能点、点了没反应"。 */
  function refreshSubmit() {
    if (libState === "ready") {
      els.submit.disabled = false;
      els.submit.textContent = mode === "signin" ? "登录" : "注册";
    } else {
      els.submit.disabled = true;
      els.submit.textContent =
        libState === "failed" ? "加载失败" :
        libState === "unconfigured" ? "未配置" : "加载中…";
    }
  }

  function busy(on) {
    if (libState !== "ready") { refreshSubmit(); return; }
    els.submit.disabled = on;
    els.submit.textContent = on ? "处理中…" : (mode === "signin" ? "登录" : "注册");
  }

  function setMode(next) {
    mode = next;
    Array.prototype.forEach.call(els.tabs.querySelectorAll(".auth-tab"), function (t) {
      t.classList.toggle("is-active", t.dataset.mode === next);
    });
    const signin = next === "signin";
    els.title.textContent = signin ? "登录" : "注册";
    els.sub.textContent = signin ? "用邮箱和密码登录" : "注册后需要去邮箱点确认链接";
    els.password.setAttribute("autocomplete", signin ? "current-password" : "new-password");
    // 加载中 / 出错时的提示不要被清掉
    if (libState === "ready") msg("");
    refreshSubmit();
  }

  els.tabs.addEventListener("click", function (e) {
    const tab = e.target.closest(".auth-tab");
    if (tab) setMode(tab.dataset.mode);
  });

  /* ---------------- 三个按钮：同步就绑好，不等库加载 ----------------
     这样即使 CDN 很慢，点下去也一定有明确反馈，而不是石沉大海。 */
  els.form.addEventListener("submit", async function (e) {
    e.preventDefault();
    if (libState !== "ready" || !supabase) {
      msg(libState === "failed"
        ? "登录服务没加载成功，刷新页面重试"
        : "登录服务还在加载，等几秒再点一次", "warn");
      return;
    }

    const email = els.email.value.trim();
    const password = els.password.value;
    if (!email || !password) { msg("请把邮箱和密码都填上", "error"); return; }
    if (password.length < 6) { msg("密码至少要 6 位", "error"); return; }

    busy(true);
    msg("");
    try {
      if (mode === "signin") {
        const { error } = await supabase.auth.signInWithPassword({ email: email, password: password });
        if (error) throw error;
        msg("登录成功", "ok");
        openPanel(false);
      } else {
        const { data, error } = await supabase.auth.signUp({
          email: email,
          password: password,
          options: { emailRedirectTo: location.href.split("#")[0] }
        });
        if (error) throw error;
        if (data && data.session) {
          msg("注册成功，已自动登录", "ok");
          openPanel(false);
        } else {
          msg("注册成功！请去 " + email + " 的收件箱点确认链接", "ok");
        }
      }
    } catch (err) {
      msg(zh(err), "error");
    } finally {
      busy(false);
    }
  });

  els.github.addEventListener("click", async function () {
    if (libState !== "ready" || !supabase) { msg("登录服务还在加载，稍等一下", "warn"); return; }
    msg("");
    const { error } = await supabase.auth.signInWithOAuth({
      provider: "github",
      options: { redirectTo: location.href.split("#")[0] }
    });
    if (error) msg(zh(error), "error");
  });

  els.signout.addEventListener("click", async function () {
    if (libState !== "ready" || !supabase) { msg("登录服务还在加载，稍等一下", "warn"); return; }
    await supabase.auth.signOut();
    msg("已退出登录", "ok");
    openPanel(false);
  });

  /* 个人中心：保存昵称
     存在账号自带的 user_metadata 里，不用建表、不用配 RLS，改完立刻生效。
     想做成"能被别人看到的公开昵称"，那才需要建 profiles 表 + RLS 策略。 */
  els.saveNick.addEventListener("click", async function () {
    if (libState !== "ready" || !supabase) { msg("登录服务还在加载，稍等一下", "warn"); return; }

    const nick = els.nick.value.trim();
    if (!nick) { msg("昵称不能为空", "error"); return; }
    if (nick.length > 20) { msg("昵称最多 20 个字", "error"); return; }

    els.saveNick.disabled = true;
    els.saveNick.textContent = "保存中…";
    try {
      const { data, error } = await supabase.auth.updateUser({ data: { nickname: nick } });
      if (error) throw error;
      if (data && data.user) renderUser(data.user);
      msg("昵称已保存", "ok");
    } catch (err) {
      msg(zh(err), "error");
    } finally {
      els.saveNick.disabled = false;
      els.saveNick.textContent = "保存昵称";
    }
  });

  /* 把 Supabase 的英文报错翻成人话 */
  const ERROR_MAP = [
    [/invalid login credentials/i,        "邮箱或密码不正确"],
    [/email not confirmed/i,              "邮箱还没确认，先去收件箱点确认链接"],
    [/user already registered/i,          "这个邮箱已经注册过了，直接登录就行"],
    [/password should be at least/i,      "密码至少要 6 位"],
    [/unable to validate email|invalid email/i, "邮箱格式看起来不对"],
    [/rate limit|too many requests/i,     "操作太频繁了，等几分钟再试"],
    [/signups not allowed|signup.*disabled/i, "该站点已关闭注册功能"]
  ];

  function zh(err) {
    const raw = (err && err.message) ? err.message : String(err || "未知错误");
    for (let i = 0; i < ERROR_MAP.length; i++) {
      if (ERROR_MAP[i][0].test(raw)) return ERROR_MAP[i][1];
    }
    return raw;
  }

  /* ---------------- 昵称 ---------------- */
  function nicknameOf(user) {
    if (!user) return "";
    const meta = user.user_metadata || {};
    return String(meta.nickname || meta.full_name || meta.name || "").trim();
  }

  // 有昵称就用昵称，没设过就退回邮箱 @ 前面那段
  function displayName(user) {
    const nick = nicknameOf(user);
    if (nick) return nick;
    const email = (user && user.email) || "";
    return email.indexOf("@") > 0 ? email.split("@")[0] : (email || "已登录");
  }

  /* ---------------- 按登录状态切换界面 ---------------- */
  function renderUser(user) {
    currentUser = user || null;
    const signedIn = !!currentUser;
    const whoChanged = (currentUser ? currentUser.id : null) !== lastUserId;
    lastUserId = currentUser ? currentUser.id : null;

    els.form.hidden = signedIn;
    els.tabs.hidden = signedIn;
    els.oauth.hidden = signedIn || !ENABLE_GITHUB_OAUTH;
    els.user.hidden = !signedIn;
    els.avatar.hidden = !signedIn;

    if (signedIn) {
      const email = currentUser.email || "";
      const name = displayName(currentUser);
      const initial = (name.charAt(0) || "?").toUpperCase();

      els.label.textContent = name;
      els.avatar.textContent = initial;
      els.profileAvatar.textContent = initial;
      els.profileName.textContent = name;
      els.userEmail.textContent = email || "（没有绑定邮箱）";
      els.title.textContent = "个人中心";
      els.sub.textContent = "改昵称 / 看账号";
      // 只在换了人时回填输入框，免得打字打到一半被冲掉
      if (whoChanged) {
        els.nick.value = nicknameOf(currentUser);
        msg("");
      }
    } else {
      els.label.textContent = "登录";
      setMode(mode);
    }
  }

  /* ---------------- 动态加载 supabase-js ---------------- */
  function loadScript(src) {
    return new Promise(function (resolve, reject) {
      const s = document.createElement("script");
      s.src = src;
      s.async = true;
      s.onload = function () { resolve(); };
      s.onerror = function () { reject(new Error("加载失败：" + src)); };
      document.head.appendChild(s);
    });
  }

  // 给每个源加超时，别让一个卡住的请求把整个流程拖死
  function withTimeout(promise, ms, label) {
    return new Promise(function (resolve, reject) {
      const timer = setTimeout(function () { reject(new Error("超时：" + label)); }, ms);
      promise.then(
        function (v) { clearTimeout(timer); resolve(v); },
        function (e) { clearTimeout(timer); reject(e); }
      );
    });
  }

  // ESM 模块 / UMD 全局 的导出形状不太一样，统一取一下 createClient
  function pickCreateClient(mod) {
    if (!mod) return null;
    if (typeof mod.createClient === "function") return mod.createClient;
    if (mod.supabase && typeof mod.supabase.createClient === "function") return mod.supabase.createClient;
    if (mod.default && typeof mod.default.createClient === "function") return mod.default.createClient;
    return null;
  }

  async function loadLibrary() {
    const tries = [];
    if (LOCAL_LIB) tries.push({ type: "esm", src: "./" + LOCAL_LIB });  // 仓库里的本地副本，优先级最高
    ESM_SOURCES.forEach(function (src) { tries.push({ type: "esm", src: src }); });
    UMD_SOURCES.forEach(function (src) { tries.push({ type: "umd", src: src }); });

    for (let i = 0; i < tries.length; i++) {
      const t = tries[i];
      try {
        if (t.type === "esm") {
          const mod = await withTimeout(import(t.src), LOAD_TIMEOUT, t.src);
          // 本地文件可能是 ESM 版也可能是 UMD 版，两种都认一下
          const fn = pickCreateClient(mod) || pickCreateClient(window.supabase);
          if (fn) return fn;
        } else {
          // 模块里的 supabase 变量会遮蔽全局，所以显式写 window.supabase
          await withTimeout(loadScript(t.src), LOAD_TIMEOUT, t.src);
          const fn = pickCreateClient(window.supabase);
          if (fn) return fn;
        }
      } catch (err) {
        /* 这个源不通或超时，试下一个 */
      }
    }
    return null;
  }

  /* ---------------- 启动 ---------------- */
  (async function initAuth() {
    if (!SUPABASE_URL || !SUPABASE_PUBLISHABLE_KEY) {
      libState = "unconfigured";
      renderUser(null);
      els.email.disabled = true;
      els.password.disabled = true;
      msg("还没配置 Supabase：把 SUPABASE_URL 和 SUPABASE_PUBLISHABLE_KEY 填到 index.html 顶部的配置区就能用了。", "warn");
      return;
    }

    // 先把"正在加载"摆出来，别让人对着一个点了没反应的按钮发呆
    refreshSubmit();
    msg("正在加载登录服务，请稍等几秒…", "warn");

    const createClient = await loadLibrary();

    if (!createClient) {
      libState = "failed";
      refreshSubmit();
      msg("登录服务加载失败（CDN 被拦截或网络太慢）。刷新重试；一直不行就把 supabase-js 下到仓库里，再把 LOCAL_LIB 打开。", "error");
      return;
    }

    libState = "ready";
    refreshSubmit();
    msg("");

    supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
      auth: {
        persistSession: true,     // 关掉浏览器再打开还是登录状态
        autoRefreshToken: true,   // 自动续期
        detectSessionInUrl: true  // 处理 OAuth 回跳
      }
    });

    /* 表单提交 / GitHub / 退出登录 三个监听器已经在上面同步绑定好了 */

    /* 读取已有登录状态，并监听后续变化 */
    const { data } = await supabase.auth.getSession();
    renderUser(data && data.session ? data.session.user : null);

    supabase.auth.onAuthStateChange(function (_event, session) {
      renderUser(session ? session.user : null);
    });
  })();
</script>

</body>
</html>
